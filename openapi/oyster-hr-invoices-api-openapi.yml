  /v1/invoices/{identifier}/approve:
    post:
      summary: Approve invoice
      tags:
      - Invoices
      description: 'Approves an invoice.


        **This endpoint requires the `X-Oyster-Actor-Email` header when using client credentials authentication.**'
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: identifier
        in: path
        description: Invoice ID or Reference code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
        '422':
          description: Operation cannot be performed
          content:
            application/json:
              examples:
                Operation cannot be performed:
                  value:
                    errors:
                    - message: The invoice is not in the right state to be approved
              schema:
                $ref: '#/components/schemas/errors'
      operationId: postV1InvoicesByIdentifierApprove
      x-operation-id-source: derived
  /v1/invoices/{identifier}/breakdown:
    get:
      summary: Retrieve invoice breakdown
      tags:
      - Invoices
      description: 'Returns the per-team-member / per-payroll-component breakdown for an invoice. Supported types: PREFUNDING, DEPOSIT, SETTLEMENT, OYSTER_FEES, MANUAL_PREFUNDING, MANUAL_SETTLEMENT, MANUAL_OYSTER_FEES. Manual types (MANUAL_*) return one amount per component (prefunding-style); MANUAL_SETTLEMENT is SETTLEMENT-only and does not use the three-row automatic settlement format (PREFUNDING + ACTUAL + SETTLEMENT).'
      security:
      - bearer_auth:
        - read
      parameters:
      - name: identifier
        in: path
        description: Invoice ID or Reference Code
        required: true
        schema:
          type: string
      responses:
