openapi: 3.2.0
info:
  title: Endpoints Invoices API
  version: v1
servers:
- url: https://api.oysterhr.com
  description: Production server
- url: https://api-sandbox.oysterhr.com
  description: Sandbox server
tags:
- name: Invoices
paths:
  /v1/invoices:
    get:
      summary: Retrieve all invoices
      tags:
      - Invoices
      description: Returns company's invoices.
      security:
      - bearer_auth:
        - read
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: reference_codes[]
        in: query
        required: false
        description: Filter by reference codes
        schema:
          type: array
          items:
            type: string
      - name: payroll_period_from
        in: query
        required: false
        description: Filter by payroll period start date (YYYY-MM format)
        schema:
          type: string
      - name: payroll_period_to
        in: query
        required: false
        description: Filter by payroll period end date (YYYY-MM format)
        schema:
          type: string
      - name: issue_date_from
        in: query
        required: false
        description: Filter by issue date start (YYYY-MM-DD format)
        schema:
          type: string
      - name: issue_date_to
        in: query
        required: false
        description: Filter by issue date end (YYYY-MM-DD format)
        schema:
          type: string
      - name: types[]
        in: query
        required: false
        description: Filter by invoice types
        schema:
          type: array
          items:
            enum:
            - PREFUNDING
            - SETTLEMENT
            - MONTHLY_PAYMENT
            - CLOSING
            - DEPOSIT
            - MANUAL
            - MANUAL_GLOBAL_PAYROLL
            - MANUAL_SALARY_INSIGHTS
            - SCALE
            - PLATFORM_PLAN
            - SALARY_INSIGHTS
            - GLOBAL_PAYROLL
            - OYSTER_FEES
            - MANUAL_PREFUNDING
            - MANUAL_SETTLEMENT
            - MANUAL_OYSTER_FEES
            - PAYG_CONTRACTOR
            - EXPENSES
            - CONTRACTOR_MONTHLY_PAYMENT
            - CONTRACTOR_FEES
            - MANUAL_INVOICE_BY_OYSTER
      - name: statuses[]
        in: query
        required: false
        description: Filter by invoice statuses
        schema:
          type: array
          items:
            enum:
            - DISPUTED
            - VOIDED
            - WAITING_APPROVAL
            - READY_FOR_REVIEW
            - APPROVED
            - AUTO_APPROVED
      - name: engagement_ids[]
        in: query
        required: false
        description: Filter by engagement IDs
        schema:
          type: array
          items:
            type: string
      - name: customer_ids[]
        in: query
        required: false
        description: Filter by customer IDs
        schema:
          type: array
          items:
            type: string
      - name: charge_statuses[]
        in: query
        required: false
        description: Filter by charge statuses
        schema:
          type: array
          items:
            enum:
            - PENDING
            - DIRECT_DEBIT_IN_PROGRESS
            - DIRECT_DEBIT_FAILED
            - CHARGED_BACK
            - PAID
            - WAITING_FOR_WIRE_TRANSFER
            - NO_PAYMENT
            - OVERDUE
            - PARTIALLY_PAID
            - VOIDED
      - name: payout_statuses[]
        in: query
        required: false
        description: Filter by payout statuses
        schema:
          type: array
          items:
            enum:
            - NO_PAYMENT
            - NOT_INITIATED
            - INITIATED
            - IN_PROGRESS
            - PAID
            - RETURNED
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                No invoices:
                  value:
                    data: []
                    meta:
                      items: 100
                      count: 0
                      page: 1
                      pages: 1
                      firstUrl: /v1/invoices?perPage=100&payrollPeriodFrom=&payrollPeriodTo=&issueDateFrom=&issueDateTo=&page=1
