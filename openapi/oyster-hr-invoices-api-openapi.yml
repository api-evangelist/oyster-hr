  /v1/invoices/{identifier}/dispute:
    post:
      summary: Dispute invoice
      tags:
      - Invoices
      description: 'Disputes an invoice.


        **This endpoint requires the `X-Oyster-Actor-Email` header when using client credentials authentication.**'
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: identifier
        in: path
        description: Invoice ID or Reference code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
        '422':
          description: Operation cannot be performed
          content:
            application/json:
              examples:
                Operation cannot be performed:
                  value:
                    errors:
                    - message: The invoice state or type can not be disputed
              schema:
                $ref: '#/components/schemas/errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 3
              required:
              - reason
            examples:
              Successful:
                summary: Successful
                value:
                  reason: Invalid invoice
      operationId: postV1InvoicesByIdentifierDispute
      x-operation-id-source: derived
components:
  schemas:
    chargeCollectionItem:
      type:
      - object
      - 'null'
      required:
      - id
      - status
      - amount
      - amountDue
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - NO_PAYMENT
          - PENDING
          - WAITING_FOR_WIRE_TRANSFER
          - OVERDUE
          - DIRECT_DEBIT_IN_PROGRESS
          - DIRECT_DEBIT_FAILED
          - CHARGED_BACK
          - PAID
          - PARTIALLY_PAID
          - VOIDED
        amount:
          $ref: '#/components/schemas/amount'
        amountDue:
          $ref: '#/components/schemas/amount'
    payoutCollectionItem:
      type:
      - object
      - 'null'
      required:
      - id
      - status
      - amount
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - NOT_INITIATED
          - INITIATED
          - IN_PROGRESS
          - PAID
          - RETURNED
          - NO_PAYMENT
          - SENT
        amount:
          $ref: '#/components/schemas/amount'
    contractorInvoice:
      type: object
      description: Additional properties specific to contractor invoices.
      properties:
        type:
          type: string
          enum:
          - PAYG_CONTRACTOR
          - EXPENSES
          - CONTRACTOR_MONTHLY_PAYMENT
          - CONTRACTOR_FEES
          - MANUAL_INVOICE_BY_OYSTER
        contractors:
          type: array
          items:
            type: object
            required:
            - id
            - name
            properties:
              id:
                type: string
              name:
                type: string
      required:
      - contractors
    invoiceBase:
      type: object
      description: Base properties for all invoices.
      properties:
        id:
          type: string
        referenceCode:
          type: string
        type:
          type: string
          enum:
          - DEPOSIT
          - PREFUNDING
          - SETTLEMENT
          - MANUAL
          - CONTRACTORS_FEE
          - MONTHLY_PAYMENT
          - AD_HOC_PAYMENT
          - EXPENSE_REIMBURSEMENT
          - GLOBAL_PAYROLL
          - SCALE
          - SALARY_INSIGHTS
          - TRUE_UPS
          - OYSTER_FEES
          - MANUAL_PREFUNDING
          - MANUAL_SETTLEMENT
          - MANUAL_OYSTER_FEES
          - MANUAL_INVOICE_BY_OYSTER
        status:
          type: string
        payrollMonth:
          type:
          - string
          - 'null'
        payrollYear:
          type:
          - string
          - 'null'
        issueDate:
          type:
          - string
          - 'null'
          format: date
        charge:
          $ref: '#/components/schemas/chargeCollectionItem'
