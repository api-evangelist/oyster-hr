openapi: 3.2.0
info:
  title: Endpoints Identity Verification API
  version: v1
servers:
- url: https://api.oysterhr.com
  description: Production server
- url: https://api-sandbox.oysterhr.com
  description: Sandbox server
tags:
- name: Identity Verification
paths:
  /v1/engagements/{id}/identity_verification:
    get:
      summary: Retrieve the latest identity verification for an engagement
      tags:
      - Identity Verification
      description: Retrieves the latest identity verification status for an engagement, regardless of whether Oyster KYC or Partner KYC was used.
      security:
      - bearer_auth:
        - read
      parameters:
      - name: id
        in: path
        description: Engagement ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful with a manual review by Oyster Staff:
                  value:
                    data:
                      id: A8cb4053
                      status: APPROVED
                      verificationData: {}
                Successful:
                  value:
                    data:
                      id: A5261556
                      status: IN_PROGRESS
                      verificationData:
                        sessionUrl: https://alchemy.veriff.com/v/91abhf71
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/identityVerification'
                required:
                - data
        '422':
          description: No identity verification found for the specified engagement
          content:
            application/json:
              examples:
                No identity verification found for the specified engagement:
                  value:
                    errors:
                    - message: No identity verification found.
      operationId: getV1EngagementsByIdIdentityVerification
      x-operation-id-source: derived
  /v1/engagements/{id}/identity_verification/approved:
    post:
      summary: Submit an approved partner identity verification
      tags:
      - Identity Verification
      description: 'Submits a successful verification result for Partner KYC, allowing you to send relevant information from your identity provider.


        Note: Access to the partner KYC process is restricted. Please reach out to api-support@oysterhr.com so we can evaluate your eligibility.'
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: id
        in: path
        description: Engagement ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully created approved partner verification
          content:
            application/json:
              examples:
                Successfully created approved partner verification:
                  value:
                    data:
                      id: A12b9d08
                      status: APPROVED
                      verificationData:
                        referenceId: unique_id_123
                        user:
                          firstName: John
                          middleName: Smith
                          lastName: Doe
                          dateOfBirth: '1990-01-01'
                        document:
                          countryCode: NL
                          type: passport
                          number: '123456789'
                          expirationDate: '2030-08-02'
                          issuanceDate: '2025-08-02'
                        screening:
                          pep: false
                          sanctions: false
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/identityVerification'
                required:
                - data
        '422':
          description: Unprocessable Entity -- Engagement must have accepted the invitation first
          content:
            application/json:
              examples:
                Unprocessable Entity -- Engagement must have accepted the invitation first:
                  value:
                    errors:
                    - message: Engagement must have accepted the invitation first.
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: Engagement must have accepted the invitation first.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                referenceId:
                  type: string
                  minLength: 1
                  description: Unique reference ID for this verification from the partner
                  example: unique_id_123
                reason:
                  type:
                  - string
                  - 'null'
                  description: Optional reason for the approval
                  example: Documents verified successfully
                user:
                  type: object
                  properties:
                    firstName:
                      type: string
                      minLength: 1
                    middleName:
                      type:
                      - string
                      - 'null'
                    lastName:
                      type: string
                      minLength: 1
                    dateOfBirth:
                      type: string
                      format: date
                      minLength: 1
                  required:
                  - firstName
                  - lastName
                  - dateOfBirth
                document:
                  type: object
                  properties:
                    countryCode:
                      type: string
                      minLength: 1
                    type:
                      type: string
                      minLength: 1
                    number:
                      type: string
                      minLength: 1
                    expirationDate:
                      type:
                      - string
                      - 'null'
                      format: date
                    issuanceDate:
                      type:
                      - string
                      - 'null'
                      format: date
                  required:
                  - countryCode
                  - type
                  - number
                screening:
                  type: object
                  properties:
                    pep:
                      type: boolean
                    sanctions:
                      type: boolean
                  required:
                  - pep
                  - sanctions
              required:
              - referenceId
              - user
              - document
              - screening
            examples:
              Successfully created approved partner verification:
                summary: Successfully created approved partner verification
                value:
                  referenceId: unique_id_123
                  user:
                    firstName: John
                    middleName: Smith
                    lastName: Doe
                    dateOfBirth: '1990-01-01'
                  document:
                    countryCode: NL
                    type: passport
                    number: '123456789'
                    expirationDate: '2030-08-02'
                    issuanceDate: '2025-08-02'
                  screening:
                    pep: false
                    sanctions: false
        required: true
      operationId: postV1EngagementsByIdIdentityVerificationApproved
      x-operation-id-source: derived
  /v1/engagements/{id}/identity_verification/declined:
    post:
      summary: Submit a declined partner identity verification
      tags:
      - Identity Verification
      description: 'Submits a failed verification result for Partner KYC, allowing you to send relevant information returned by your identity provider.


        Note: Access to the partner KYC process is restricted. Please reach out to api-support@oysterhr.com so we can evaluate your eligibility.'
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: id
        in: path
        description: Engagement ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully created declined partner verification
          content:
            application/json:
              examples:
                Successfully created declined partner verification:
                  value:
                    data:
                      id: A12b9d08
                      status: DECLINED
                      verificationData:
                        referenceId: unique_id_456
                        reason: DOCUMENT_INVALID
                        user:
                          firstName: John
                          middleName: Smith
                          lastName: Doe
                          dateOfBirth: '1990-01-01'
                        document:
                          countryCode: NL
                          type: passport
                          number: '123456789'
                          expirationDate: '2030-08-02'
                          issuanceDate: '2025-08-02'
                        screening:
                          pep: false
                          sanctions: false
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/identityVerification'
                required:
                - data
        '422':
          description: Unprocessable Entity -- Engagement must have accepted the invitation first
          content:
            application/json:
              examples:
                Unprocessable Entity -- Engagement must have accepted the invitation first:
                  value:
                    errors:
                    - message: Engagement must have accepted the invitation first.
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: Engagement must have accepted the invitation first.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                referenceId:
                  type: string
                  minLength: 1
                  description: Unique reference ID for this verification from the partner
                  example: unique_id_456
                reason:
                  type:
                  - string
                  - 'null'
                  description: Reason for the decline
                  example: DOCUMENT_INVALID
                user:
                  type: object
                  properties:
                    firstName:
                      type: string
                      minLength: 1
                    middleName:
                      type:
                      - string
                      - 'null'
                    lastName:
                      type: string
                      minLength: 1
                    dateOfBirth:
                      type: string
                      format: date
                      minLength: 1
                  required:
                  - firstName
                  - lastName
                  - dateOfBirth
                document:
                  type: object
                  properties:
                    countryCode:
                      type: string
                      minLength: 1
                    type:
                      type: string
                      minLength: 1
                    number:
                      type: string
                      minLength: 1
                    expirationDate:
                      type:
                      - string
                      - 'null'
                      format: date
                    issuanceDate:
                      type:
                      - string
                      - 'null'
                      format: date
                  required:
                  - countryCode
                  - type
                  - number
                screening:
                  type: object
                  properties:
                    pep:
                      type: boolean
                    sanctions:
                      type: boolean
                  required:
                  - pep
                  - sanctions
              required:
              - referenceId
              - user
              - document
              - screening
            examples:
              Successfully created declined partner verification:
                summary: Successfully created declined partner verification
                value:
                  referenceId: unique_id_456
                  reason: DOCUMENT_INVALID
                  user:
                    firstName: John
                    middleName: Smith
                    lastName: Doe
                    dateOfBirth: '1990-01-01'
                  document:
                    countryCode: NL
                    type: passport
                    number: '123456789'
                    expirationDate: '2030-08-02'
                    issuanceDate: '2025-08-02'
                  screening:
                    pep: false
                    sanctions: false
        required: true
      operationId: postV1EngagementsByIdIdentityVerificationDeclined
      x-operation-id-source: derived
  /v1/engagements/{id}/identity_verification/sessions:
    post:
      summary: Create or resume a verification session
      tags:
      - Identity Verification
      description: Initiates an Oyster KYC session, creating a link from Oyster's identity provider to be sent to the team member.
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: id
        in: path
        description: Engagement ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful resumption
          content:
            application/json:
              examples:
                Successful creation:
                  value:
                    data:
                      id: A5261556
                      status: IN_PROGRESS
                      verificationData:
                        sessionUrl: https://stationapi.veriff.com/v1/sessions/91abhf71
                Successful resumption:
                  value:
                    data:
                      id: A5261556
                      status: IN_PROGRESS
                      verificationData:
                        sessionUrl: https://stationapi.veriff.com/v1/sessions/91abhf71
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/identityVerification'
                required:
                - data
        '422':
          description: Unprocessable Entity -- Engagement must have accepted the invitation first
          content:
            application/json:
              examples:
                Unprocessable Entity -- Engagement In Draft:
                  value:
                    errors:
                    - message: Engagement must have accepted the invitation first.
                Unprocessable -- Verification already approved:
                  value:
                    errors:
                    - message: Verification already approved
                Unprocessable -- Exceeded the limit of 3 verification attempts:
                  value:
                    errors:
                    - message: Exceeded the limit of 3 verification attempts
                Unprocessable Entity -- Engagement must have accepted the invitation first:
                  value:
                    errors:
                    - message: Engagement must have accepted the invitation first.
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                          example: Engagement must have accepted the invitation first.
      operationId: postV1EngagementsByIdIdentityVerificationSessions
      x-operation-id-source: derived
components:
  schemas:
    partnerKycVerificationData:
      type: object
      properties:
        referenceId:
          type: string
        reason:
          type: string
        user:
          type: object
          properties:
            firstName:
              type: string
            middleName:
              type: string
            lastName:
              type: string
            dateOfBirth:
              type: string
              format: date
          required:
          - firstName
          - lastName
          - dateOfBirth
        document:
          type: object
          properties:
            countryCode:
              type: string
            type:
              type: string
            number:
              type: string
            expirationDate:
              type: string
              format: date
            issuanceDate:
              type: string
              format: date
          required:
          - countryCode
          - type
          - number
        screening:
          type: object
          properties:
            pep:
              type: boolean
            sanctions:
              type: boolean
          required:
          - pep
          - sanctions
      required:
      - referenceId
      - user
      - document
      - screening
    autoKycVerificationData:
      type: object
      properties:
        sessionUrl:
          type: string
          format: uri
      required:
      - sessionUrl
    identityVerification:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - IN_PROGRESS
          - RESUBMISSION_REQUIRED
          - APPROVED
          - DECLINED
        verificationData:
          anyOf:
          - $ref: '#/components/schemas/autoKycVerificationData'
          - $ref: '#/components/schemas/partnerKycVerificationData'
          - type: object
            properties: {}
      required:
      - id
      - status
      - verificationData
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
