tags:
- name: Contract Changes
  description: 'With the Contract Changes API, you can manage your team''s contract change requests.

    You can access details of a specific request, cancel change requests, and view a list of all requests.'
- name: Expenses
  description: "Expenses API allows you to remotely manage expenses of your team. \nApprove or decline a specific expense, get info about a specific expense or receive real-time information about all expenses."
- name: Time Off
  description: 'With the Time Off API, you can manage your team''s time off requests.

    You can approve or decline specific time off requests, access information about a particular request, and get updates on all time off requests.

    It also provides details on time off entitlements for each engagement within the company'
