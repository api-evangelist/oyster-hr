        required: true
        schema:
          type: string
      - name: agreement_id
        in: path
        description: Agreement ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      id: A6fda22e
                      name: Employment Agreement
                      type: EMPLOYMENT_AGREEMENT
                      parties:
                      - TEAM_MEMBER
                      state: VERIFIED
                      preview:
                        url: http://localhost:3000/h/documents/agreements/A6fda22e
                        contentType: application/pdf
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/agreement'
                required:
                - data
        '422':
          description: The agreement can't be verified
          content:
            application/json:
              examples:
                The agreement does not exist, or no permission to access it:
                  value:
                    errors:
                    - message: Agreement not found.
                The agreement cannot be verified:
                  value:
                    errors:
                    - message: The automated Oyster Service Agreement can only be verified by Oyster staff.
                The agreement has new changes:
                  value:
                    errors:
                    - message: The agreement has new changes. Only the newest version can be verified.
                Onboarding form is not completed:
                  value:
                    errors:
                    - message: The onboarding form must be completed before verifying any agreement.
                Oyster service agreement is not signed:
                  value:
                    errors:
                    - message: The Oyster Service Agreement must be finalized before verifying any other agreement.
                The agreement can't be verified:
                  value:
                    errors:
                    - message: The agreement is pending. Only draft agreements can be verified.
