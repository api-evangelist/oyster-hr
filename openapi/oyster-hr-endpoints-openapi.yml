                            - BIANNUAL
                            - YEARLY
                        required:
                        - label
                        - amountDecimal
                        - resetFrequency
                    remoteWorkCosts:
                      type: object
                      properties:
                        equipmentListProvidedByCustomer:
                          type: object
                          properties:
                            equipmentList:
                              type: array
                              items:
                                type: string
                                enum:
                                - COMPUTER_MONITOR
                                - HEADSET
                                - KEYBOARD
                                - LAPTOP_COMPUTER
                                - MOBILE_PHONE
                                - MOUSE
                                - PRINTER
                                - OTHER
                            equipmentOther:
                              type: string
                              minLength: 1
                              maxLength: 255
                          required:
                          - equipmentList
                        equipmentListOwnedByTeamMember:
                          type: object
                          properties:
                            equipmentList:
                              type: array
                              items:
                                type: string
                                enum:
                                - COMPUTER_MONITOR
                                - HEADSET
                                - KEYBOARD
                                - LAPTOP_COMPUTER
                                - MOBILE_PHONE
                                - MOUSE
                                - PRINTER
                                - OTHER
                            equipmentOther:
                              type: string
                              minLength: 1
                              maxLength: 255
                          required:
                          - equipmentList
                        equipmentBudget:
                          type: object
                          properties:
                            amountDecimal:
                              type: string
                              pattern: ^(?=.*[1-9])(0|[1-9][0-9]*)(\.[0-9]{2,})?$
                          required:
                          - amountDecimal
                        equipmentOneTimePayment:
                          type: object
                          properties:
                            amountDecimal:
                              type: string
                              pattern: ^(?=.*[1-9])(0|[1-9][0-9]*)(\.[0-9]{2,})?$
                          required:
                          - amountDecimal
                        allowancePolicy:
                          type: object
                          properties:
                            allowancePolicy:
                              type: string
                              enum:
                              - MONTHLY_ALLOWANCE
                              - ONE_TIME_STIPEND
                              - BASIC_REIMBURSEMENT
                              - NO_REIMBURSEMENT
                            amountDecimal:
                              type: string
                              pattern: ^(?=.*[1-9])(0|[1-9][0-9]*)(\.[0-9]{2,})?$
                          required:
                          - allowancePolicy
                    privateNotes:
                      nullable: true
                      type: string
                      maxLength: 10000
                    sickPay:
                      type: object
                      properties:
                        option:
                          type: string
                        customDuration:
                          type: object
                          properties:
                            value:
                              type: integer
                            unit:
                              type: string
                              enum:
                              - DAYS
                              - WEEKS
                              - MONTHS
                          required:
                          - value
                          - unit
                      required:
                      - option
                    commissionPlanOffered:
                      type: boolean
                signer:
