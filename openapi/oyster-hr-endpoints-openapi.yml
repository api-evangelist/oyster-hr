  /v1/public_holidays:
    get:
      summary: Retrieve public holidays
      tags:
      - Time Off
      - time_off
      - '@oysterhr/prepay'
      description: This API endpoint lets you retrieve the public holidays between specified dates. Note that the endpoint supports retrieving holidays up to two years in advance.
      security:
      - bearer_auth:
        - read
      parameters:
      - name: country_code
        in: query
        schema:
          type: string
          description: ISO 3166-1 alpha-2 country code
        required: false
      - name: subdivision_code
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 3
          description: ISO 3166-2 subdivision code
        required: false
      - name: engagement_id
        in: query
        schema:
          type: string
        required: false
      - name: start_date
        in: query
        schema:
          type: string
          format: date
          minLength: 1
        required: true
      - name: end_date
        in: query
        schema:
          type: string
          format: date
          minLength: 1
        required: true
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                    - date: '2022-12-31'
                      dayOfWeek: SATURDAY
                      name: New years eve
                      type: LOCAL
                    - date: '2023-05-01'
                      dayOfWeek: MONDAY
                      name: New years eve
                      type: NATIONAL
                    meta:
                      items: 100
                      count: 2
                      page: 1
                      pages: 1
                      firstUrl: /v1/public_holidays?countryCode=&subdivisionCode=AZ&engagementId=A5540727&startDate=2022-01-01&endDate=2023-12-31&perPage=100&page=1
                      lastUrl: /v1/public_holidays?countryCode=&subdivisionCode=AZ&engagementId=A5540727&startDate=2022-01-01&endDate=2023-12-31&perPage=100&page=1
                      pageUrl: /v1/public_holidays?countryCode=&subdivisionCode=AZ&engagementId=A5540727&startDate=2022-01-01&endDate=2023-12-31&perPage=100&page=1
                      nextUrl: /v1/public_holidays?countryCode=&subdivisionCode=AZ&engagementId=A5540727&startDate=2022-01-01&endDate=2023-12-31&perPage=100&page=
                      prevUrl: /v1/public_holidays?countryCode=&subdivisionCode=AZ&engagementId=A5540727&startDate=2022-01-01&endDate=2023-12-31&perPage=100&page=
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/publicHolidays'
                  meta:
                    $ref: '#/components/schemas/meta'
                required:
                - data
                - meta
        '400':
          description: Invalid dates
          content:
            application/json:
              examples:
                Date not supported:
                  value:
                    errors:
                    - field: start_date
                      type: invalid
                      message: only dates up to two years in advance are supported
                Both the engagement_id and country_code parameters provided:
                  value:
                    errors:
                    - message: You must provide exactly one of country_code or engagement_id parameters
                Invalid dates:
                  value:
                    errors:
                    - field: start_date
                      type: invalid
                      message: the start date is after the end date
                    - field: end_date
                      type: invalid
                      message: the start date is after the end date
              schema:
                $ref: '#/components/schemas/errors'
