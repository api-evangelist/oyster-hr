                      type: string
                      minLength: 100
                      maxLength: 3000
                      description: Description of the team member's decision-making authority.
                    minimumQualification:
                      nullable: true
                      type: string
                      maxLength: 3000
                      description: Description of the team member's minimum qualification.
                    initialStartDate:
