  /v1/invoices/{identifier}/dispute:
    post:
      summary: Dispute invoice
      tags:
      - Invoices
      description: 'Disputes an invoice.


        **This endpoint requires the `X-Oyster-Actor-Email` header when using client credentials authentication.**'
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: identifier
        in: path
        description: Invoice ID or Reference code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
        '422':
          description: Operation cannot be performed
          content:
            application/json:
              examples:
                Operation cannot be performed:
                  value:
                    errors:
                    - message: The invoice state or type can not be disputed
              schema:
                $ref: '#/components/schemas/errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 3
              required:
              - reason
            examples:
              Successful:
                summary: Successful
                value:
                  reason: Invalid invoice
