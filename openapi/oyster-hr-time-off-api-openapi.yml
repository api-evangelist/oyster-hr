openapi: 3.2.0
info:
  title: Endpoints Time Off API
  version: v1
  description: 'With the Time Off API, you can manage your team''s time off requests.

    You can approve or decline specific time off requests, access information about a particular request, and get updates on all time off requests.

    It also provides details on time off entitlements for each engagement within the company'
servers:
- url: https://api.oysterhr.com
  description: Production server
- url: https://api-sandbox.oysterhr.com
  description: Sandbox server
tags:
- name: Time Off
  description: 'With the Time Off API, you can manage your team''s time off requests.

    You can approve or decline specific time off requests, access information about a particular request, and get updates on all time off requests.

    It also provides details on time off entitlements for each engagement within the company'
paths:
  /v1/public_holidays:
    get:
      summary: Retrieve public holidays
      tags:
      - Time Off
      description: This API endpoint lets you retrieve the public holidays between specified dates. Note that the endpoint supports retrieving holidays up to two years in advance.
      security:
      - bearer_auth:
        - read
      parameters:
      - name: country_code
        in: query
        schema:
          type: string
          description: ISO 3166-1 alpha-2 country code
        required: false
      - name: subdivision_code
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 3
          description: ISO 3166-2 subdivision code
        required: false
      - name: engagement_id
        in: query
        schema:
          type: string
        required: false
      - name: start_date
        in: query
        schema:
          type: string
          format: date
          minLength: 1
        required: true
      - name: end_date
        in: query
        schema:
          type: string
          format: date
          minLength: 1
        required: true
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                    - date: '2022-12-31'
                      dayOfWeek: SATURDAY
                      name: New years eve
                      type: LOCAL
                    - date: '2023-05-01'
                      dayOfWeek: MONDAY
                      name: New years eve
                      type: NATIONAL
                    meta:
                      items: 100
                      count: 2
                      page: 1
                      pages: 1
                      firstUrl: /v1/public_holidays?countryCode=&subdivisionCode=AZ&engagementId=A5540727&startDate=2022-01-01&endDate=2023-12-31&perPage=100&page=1
                      lastUrl: /v1/public_holidays?countryCode=&subdivisionCode=AZ&engagementId=A5540727&startDate=2022-01-01&endDate=2023-12-31&perPage=100&page=1
                      pageUrl: /v1/public_holidays?countryCode=&subdivisionCode=AZ&engagementId=A5540727&startDate=2022-01-01&endDate=2023-12-31&perPage=100&page=1
                      nextUrl: /v1/public_holidays?countryCode=&subdivisionCode=AZ&engagementId=A5540727&startDate=2022-01-01&endDate=2023-12-31&perPage=100&page=
                      prevUrl: /v1/public_holidays?countryCode=&subdivisionCode=AZ&engagementId=A5540727&startDate=2022-01-01&endDate=2023-12-31&perPage=100&page=
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/publicHolidays'
                  meta:
                    $ref: '#/components/schemas/meta'
                required:
                - data
                - meta
        '400':
          description: Invalid dates
          content:
            application/json:
              examples:
                Date not supported:
                  value:
                    errors:
                    - field: start_date
                      type: invalid
                      message: only dates up to two years in advance are supported
                Both the engagement_id and country_code parameters provided:
                  value:
                    errors:
                    - message: You must provide exactly one of country_code or engagement_id parameters
                Invalid dates:
                  value:
                    errors:
                    - field: start_date
                      type: invalid
                      message: the start date is after the end date
                    - field: end_date
                      type: invalid
                      message: the start date is after the end date
              schema:
                $ref: '#/components/schemas/errors'
      operationId: getV1PublicHolidays
      x-operation-id-source: derived
  /v1/time_off/entitlements:
    get:
      summary: Retrieve entitlements
      tags:
      - Time Off
      description: Returns entitlements for each engagement of the company.
      security:
      - bearer_auth:
