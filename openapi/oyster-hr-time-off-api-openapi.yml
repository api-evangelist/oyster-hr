      x-operation-id-source: derived
  /v1/time_off/entitlements/{id}:
    get:
      summary: Retrieve entitlements for individual engagement
      tags:
      - Time Off
      description: Returns entitlements for an engagement.
      security:
      - bearer_auth:
        - read
      parameters:
      - name: id
        in: path
        description: Engagement ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      engagement:
                        engagementId: A5540727
                        name: Dr. Ines Denesik
                        type: EMPLOYMENT
                        countryCode: GB
                      annualEntitlement: 0
                      accrued: 0
                      carried: 0
                      adjustedAdhoc: 0
                      taken: 0
                      availableBalance: 0
                      upcoming: 0
                      projectedBalance: 0
                      units: DAYS
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/timeOffEntitlement'
                required:
                - data
        '422':
          description: Cannot determine entitlements for given resource
          content:
            application/json:
              examples:
                Cannot determine entitlements for given resource:
                  value:
                    errors:
                    - message: The entitlements cannot be determined for given engagement.
              schema:
