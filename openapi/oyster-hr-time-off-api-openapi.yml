              schema:
                $ref: '#/components/schemas/errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 1
              required:
              - reason
            examples:
              Successful:
                summary: Successful
                value:
                  reason: We need you!
      operationId: postV1TimeOffRequestsByIdReject
      x-operation-id-source: derived
components:
  schemas:
    publicHolidays:
      type: array
      items:
        type: object
        properties:
          date:
            type: string
            format: date
          dayOfWeek:
            type: string
            enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          name:
            type: string
          type:
            type: string
            enum:
            - NATIONAL
            - LOCAL
    timeOffRequests:
      type: array
      items:
        $ref: '#/components/schemas/timeOffRequest'
    timeOffRequest:
      type: object
      properties:
        timeOffRequestId:
          type: string
        engagement:
          $ref: '#/components/schemas/timeOffEngagementDetails'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        firstDayDuration:
          type:
          - string
          - 'null'
          pattern: ^[A-Z_]+$
        lastDayDuration:
          type:
          - string
          - 'null'
          pattern: ^[A-Z_]+$
        firstDayDurationInHours:
          type:
          - number
          - 'null'
          format: float
        lastDayDurationInHours:
          type:
          - number
          - 'null'
          format: float
        state:
          type: string
          pattern: ^[A-Z_]+$
        type:
          type: string
          pattern: ^[A-Z_]+$
        requesterComments:
