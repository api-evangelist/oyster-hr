openapi: 3.2.0
info:
  title: Endpoints Consent API
  version: v1
servers:
- url: https://api.oysterhr.com
  description: Production server
- url: https://api-sandbox.oysterhr.com
  description: Sandbox server
tags:
- name: Consent
paths:
  /v1/consent/grants:
    delete:
      summary: Revoke consent grant
      tags:
      - Consent
      description: Revokes an existing consent grant for an engagement.
      security:
      - bearer_auth:
        - manage
      parameters: []
      responses:
        '200':
          description: Successful
        '422':
          description: Unprocessable entity
          content:
            application/json:
              examples:
                Unprocessable entity:
                  value:
                    errors:
                    - message: Consent grant not found or already revoked
              schema:
                $ref: '#/components/schemas/errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                engagementId:
                  type: string
                  minLength: 1
                  pattern: ^[\w+\-]{8,9}$
                consentStatementHash:
                  type: string
                  minLength: 1
                revokedAt:
                  type: string
                  format: date-time
                ipAddress:
                  type: string
                  minLength: 1
              required:
              - engagementId
              - consentStatementHash
              - revokedAt
              - ipAddress
            examples:
              Successful:
                summary: Successful
                value:
                  engagementId: A5540727
                  consent_statement_hash: hduWqKYCV82HTcKFfsbsO8YaqVS11YRmgiX0YDSsSbc=
                  revoked_at: '2022-10-15T12:34:56Z'
                  ip_address: 119.175.35.155
      operationId: deleteV1ConsentGrants
      x-operation-id-source: derived
    post:
      summary: Create consent grant
      tags:
      - Consent
      description: Creates a new consent grant for an engagement.
      security:
      - bearer_auth:
        - manage
      parameters: []
      responses:
        '200':
          description: Successful
        '422':
          description: Unprocessable entity
          content:
            application/json:
              examples:
                Unprocessable entity:
                  value:
                    errors:
                    - message: Unrevoked consent record already exists for this engagement and consent statement
              schema:
                $ref: '#/components/schemas/errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                engagementId:
                  type: string
                  minLength: 1
                  pattern: ^[\w+\-]{8,9}$
                consentStatementHash:
                  type: string
                  minLength: 1
                givenAt:
                  type: string
                  format: date-time
                ipAddress:
                  type: string
                  minLength: 1
              required:
              - engagementId
              - consentStatementHash
              - givenAt
              - ipAddress
            examples:
              Successful:
                summary: Successful
                value:
                  engagementId: A5540727
                  consent_statement_hash: hduWqKYCV82HTcKFfsbsO8YaqVS11YRmgiX0YDSsSbc=
                  given_at: '2022-10-15T12:34:56Z'
                  ip_address: 119.175.35.155
      operationId: postV1ConsentGrants
      x-operation-id-source: derived
components:
  schemas:
    errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
            required:
            - message
      required:
      - errors
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
