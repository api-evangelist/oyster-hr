  /v1/offboardings/payroll_team_members/terminations/rulesets:
    get:
      summary: Retrieve rulesets for drafting an offboarding for a payroll team member
      tags:
      - Offboarding
      description: 'Use engagement_id to fetch the ruleset relating to a specific engagement.

        Use country_code to fetch the ruleset for a particular country.'
      security:
      - bearer_auth:
        - read
      parameters:
      - name: engagement_id
        in: query
        required: false
        description: The ID of a specific engagement
        schema:
          type: string
      - name: country_code
        in: query
        required: false
        description: The country code for the engagement, e.g. GB
        schema:
          type: string
      responses:
        '200':
          description: Successful access to the ruleset
          content:
            application/json:
              examples:
                Successful access to the ruleset:
                  value:
                    data:
                      rulesetId: OFFBOARDING_PAYROLL_TERMINATION
                      scope:
                        engagementId: A5540727
                      schemas:
                        post:
                          type: object
                          properties:
                            engagementId:
                              type: string
                              minLength: 1
                              pattern: ^[\w+\-]{8,9}$
                            categoryId:
                              type: string
                              minLength: 1
                              pattern: ^[\w+\-]{8,9}$
                            lastWorkingDayOn:
                              type: string
                              format: date
                              minLength: 1
                            lastDayOn:
                              type: string
                              format: date
                              minLength: 1
                            mutualTermination:
                              type: boolean
                            notes:
                              type: string
                              minLength: 1
                            ptoDaysRemaining:
                              type: number
                              minimum: 0
                            additionalPayments:
                              type: array
                              items:
                                type: object
                                properties:
                                  payTypeId:
                                    type: string
                                    minLength: 1
                                    pattern: ^[\w+\-]{8,9}$
                                  amount:
                                    type: object
                                    properties:
                                      decimal:
                                        type: string
                                        minLength: 1
                                        pattern: ^[0-9]+(\.[0-9]{2,})?$
                                    required:
                                    - decimal
                                  allowance:
                                    type: string
                                    minLength: 1
                                  redundancyPayment:
                                    type: string
                                    minLength: 1
                                  paymentPeriod:
                                    type: string
                                    minLength: 1
                                    enum:
                                    - days
                                    - weeks
                                  paymentPeriodDuration:
                                    type: integer
                                required:
                                - payTypeId
                            payrollPayoutMonthChange:
                              type: object
                              properties:
                                reason:
                                  type: string
                                  minLength: 1
                                proposedPayrollPayoutMonth:
                                  type: string
                                  minLength: 1
                                  pattern: ^\d{4}-(?:0[1-9]|1[0-2])$
                              required:
