openapi: 3.2.0
info:
  title: Endpoints Payroll API
  version: v1
servers:
- url: https://api.oysterhr.com
  description: Production server
- url: https://api-sandbox.oysterhr.com
  description: Sandbox server
tags:
- name: Payroll
paths:
  /v1/payroll:
    get:
      summary: Retrieve all payroll
      tags:
      - Payroll
      description: Returns a list of payrolls, max items per request would be 12
      security:
      - bearer_auth:
        - read
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                No payrolls:
                  value:
                    data: []
                    meta:
                      items: 12
                      count: 0
                      page: 1
                      pages: 1
                      firstUrl: /v1/payroll?perPage=12&page=1&from=&to=
                      lastUrl: /v1/payroll?perPage=12&page=1&from=&to=
                      pageUrl: /v1/payroll?perPage=12&page=1&from=&to=
                      nextUrl: /v1/payroll?perPage=12&page=&from=&to=
                      prevUrl: /v1/payroll?perPage=12&page=&from=&to=
                Successful:
                  value:
                    data:
                    - id: B7cf5c51
                      payrollId: B7cf5c51
                      currencyCode: USD
                      cutoffTimeForPayroll: '2022-10-07T05:00:00.000Z'
                      state: DRAFT
                      payrollRecordsCount: 2
                    - id: Afdc8fa8
                      payrollId: Afdc8fa8
                      currencyCode: USD
                      cutoffTimeForPayroll: '2022-10-07T05:00:00.000Z'
                      state: DRAFT
                      payrollRecordsCount: 2
                    meta:
                      items: 12
                      count: 2
                      page: 1
                      pages: 1
                      firstUrl: /v1/payroll?perPage=12&page=1&from=2023-03&to=2023-04
                      lastUrl: /v1/payroll?perPage=12&page=1&from=2023-03&to=2023-04
                      pageUrl: /v1/payroll?perPage=12&page=1&from=2023-03&to=2023-04
                      nextUrl: /v1/payroll?perPage=12&page=&from=2023-03&to=2023-04
                      prevUrl: /v1/payroll?perPage=12&page=&from=2023-03&to=2023-04
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/payrolls'
                  meta:
                    $ref: '#/components/schemas/meta'
                required:
                - data
                - meta
      operationId: getV1Payroll
      x-operation-id-source: derived
  /v1/payroll/{id}:
    get:
      summary: Retrieve an individual payroll
      tags:
      - Payroll
      description: Returns details for a payroll with a given payroll ID.
      security:
      - bearer_auth:
        - read
      parameters:
      - name: id
        in: path
        description: Payroll ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      id: Afdc8fa8
                      payrollId: Afdc8fa8
                      currencyCode: USD
                      cutoffTimeForPayroll: '2022-10-07T05:00:00.000Z'
                      state: DRAFT
                      payrollRecordsCount: 2
                      records:
                      - id: Afdc8fa8
