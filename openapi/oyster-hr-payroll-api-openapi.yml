components:
  schemas:
    payroll:
      type: object
      properties:
        payrollId:
          type: string
        currencyCode:
          type: string
        cutoffTimeForPayroll:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: string
        payrollRecordsCount:
          type: integer
      required:
      - payrollId
      - currencyCode
      - cutoffTimeForPayroll
      - state
      - payrollRecordsCount
    payrollRecord:
      type: object
      properties:
        id:
          type: string
        engagementId:
          type:
          - string
          - 'null'
        currencyCode:
          type: string
        monthlyPaymentsTotalAmount:
          $ref: '#/components/schemas/amount'
        allowancesTotalAmount:
          $ref: '#/components/schemas/amount'
        benefitsTotalAmount:
          $ref: '#/components/schemas/amount'
        bonusesTotalAmount:
          $ref: '#/components/schemas/amount'
        addOnsTotalAmount:
          $ref: '#/components/schemas/amount'
        taxesTotalAmount:
          $ref: '#/components/schemas/amount'
        trueUpsTotalAmount:
          $ref: '#/components/schemas/amount'
        oysterFeesTotalAmount:
          $ref: '#/components/schemas/amount'
        engagement:
          type:
          - object
          - 'null'
          properties:
            name:
              type: string
            cutoffMonthDay:
              type: integer
            engagementType:
              type: string
            type:
              type: string
          required:
          - name
          - cutoffMonthDay
          - engagementType
          - type
      required:
      - id
      - engagementId
      - currencyCode
      - monthlyPaymentsTotalAmount
      - allowancesTotalAmount
      - benefitsTotalAmount
      - bonusesTotalAmount
      - addOnsTotalAmount
      - taxesTotalAmount
      - trueUpsTotalAmount
      - oysterFeesTotalAmount
      - engagement
    payrollRecords:
      type: array
      items:
        $ref: '#/components/schemas/payrollRecord'
    meta:
      type: object
      properties:
        items:
          type: integer
        count:
          type: integer
        page:
          type: integer
        pages:
          type: integer
        firstUrl:
          type: string
        lastUrl:
          type: string
        pageUrl:
          type: string
        nextUrl:
          type: string
        prevUrl:
          type: string
        deprecation:
          type: object
          properties:
            at:
              type: string
            sunset:
              type: string
            link:
              type: object
              properties:
                rel:
                  type: string
                url:
                  type: string
      required:
      - items
      - count
      - page
      - pages
      - firstUrl
      - lastUrl
      - pageUrl
      - nextUrl
      - prevUrl
    payrolls:
      type: array
      items:
        $ref: '#/components/schemas/payroll'
    amount:
      type: object
      properties:
        decimal:
          type: string
          pattern: ^\d+([.]\d+)?$
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
      required:
      - decimal
      - currencyCode
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
