      x-operation-id-source: derived
  /v1/payroll/{id}/records:
    get:
      summary: Retrieve payroll records for individual payroll
      tags:
      - Payroll
      description: Returns a list of payroll records for an individual payroll, max items per request is 10
      security:
      - bearer_auth:
        - read
      parameters:
      - name: id
        in: path
        description: Payroll ID
        required: true
        schema:
          type: string
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
