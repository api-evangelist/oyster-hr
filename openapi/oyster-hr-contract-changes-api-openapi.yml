  /v1/contract_changes/rulesets:
    get:
      summary: Retrieve rulesets for creating a contract change
      tags:
      - Contract Changes
      description: 'This API endpoint allows you to get the ruleset for creating a contract change for an engagement of a particular country, engagement type and contracting type.

        Use country_code with engagement_type and contracting_type to get more detailed rules.

        Alternatively, use engagement_id (on its own) to fetch the ruleset relating to a specific engagement.

        Either engagement_id or country_code with engagement_type are required.

        contracting_type is only required when engagement_type is contract.'
      security:
      - bearer_auth:
        - read
      parameters:
      - name: country_code
        in: query
        required: false
        description: The country code for the engagement, e.g. US
        schema:
          type: string
      - name: engagement_type
        in: query
        schema:
          type: string
          enum:
          - EMPLOYMENT
          - CONTRACT
        required: false
        description: The type of the engagement
      - name: contracting_type
        in: query
        schema:
          type: string
          enum:
          - PAY_AS_YOU_GO
          - FIXED
        required: false
        description: Contracting type of the contractor
      - name: engagement_id
        in: query
        required: false
        description: The ID of a specific engagement
        schema:
          type: string
      responses:
        '200':
          description: Successful access to the ruleset
          content:
            application/json:
              examples:
                Successful access to the ruleset:
                  value:
                    data:
                      rulesetId: CONTRACT_CHANGES_CONTRACT_PAYG
                      scope:
                        countryCode: US
                        engagementType: contract
                        contractingType: pay_as_you_go
                      schemas:
                        post:
                          type: object
                          properties:
                            engagementId:
                              type: string
                              minLength: 1
                            effectiveFrom:
                              type: string
                              format: date
                              minLength: 1
                            jobTitle:
                              type: string
                              minLength: 1
                            jobDescription:
                              type: string
                              minLength: 1
                            seniority:
                              type: string
                              enum:
                              - JUNIOR
                              - MID
                              - SENIOR
                              - PRINCIPAL
                              - LEAD
                              - DIRECTOR
                              - HEAD
                              - VP
                              - CSUITE
                            allowancesToAdd:
                              type: array
                              items:
                                type: object
                                properties:
                                  label:
                                    type: string
                                    enum:
                                    - HEALTH_AND_WELLBEING
                                    - LEARNING_DEVELOPMENT
                                    - SUSTENANCE
                                    - TRAVEL
                                  amountDecimal:
                                    type: string
                                    pattern: ^(?=.*[1-9])(0|[1-9][0-9]*)(\.[0-9]{2,})?$
                                  paymentFrequency:
                                    type: string
                                    enum:
                                    - MONTHLY
                                    - QUARTERLY
                                    - BIANNUAL
                                    - YEARLY
                                    - ONE_TIME
                                  selectedMonths:
                                    type: array
                                    items:
                                      type: integer
                                      minimum: 1
                                      maximum: 12
                                required:
                                - label
                                - amountDecimal
                                - paymentFrequency
                            bonusesToAdd:
                              type: array
                              items:
                                type: object
                                properties:
                                  label:
                                    type: string
                                    enum:
                                    - END_OF_YEAR
                                    - VACATION_BONUS
                                    - HOLIDAY_BONUS
                                    - PERFORMANCE
                                    - RETENTION
                                    - COMMISSION_PERCENTAGE
                                    - COMMISSION_AMOUNT
                                  amountDecimal:
                                    type: string
                                    pattern: ^(?=.*[1-9])(0|[1-9][0-9]*)(\.[0-9]{2,})?$
                                  amountAsPercentage:
                                    type: string
                                    pattern: ^(100(\.0+)?|[0-9]{1,2}(\.[0-9]{1,6})?)$
                                  paymentFrequency:
                                    type: string
