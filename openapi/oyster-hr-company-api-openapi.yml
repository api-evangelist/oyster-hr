tags:
- name: Company
paths:
  /v1/company:
    get:
      summary: Retrieve company details
      tags:
      - Company
      description: Returns details about the connected company
      security:
      - bearer_auth:
        - read
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      id: A2f05d13
                      companyId: A2f05d13
                      name: company 00001 name
                      registrationNumber: E15085814
                      addresses:
                        corporateAddress:
                          id: A89578c8
                          addressId: A89578c8
                          addressLine1: 365 Walter Land
                          addressLine2: Summer Estates
                          city: Yongview
                          region: SFO
                          regionName: San Fernando
                          countryCode: TT
                          postalCode: '54590'
                        billingAddress:
                          id: B7c7c7aa
                          addressId: B7c7c7aa
                          addressLine1: 89913 Kihn Field
                          addressLine2: Autumn Square
                          city: Dietrichview
                          region: SAN
                          regionName: Santander
                          countryCode: CO
                          postalCode: 28998-6207
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/company'
                required:
                - data
      operationId: getV1Company
      x-operation-id-source: derived
components:
  schemas:
    address:
      type: object
      properties:
        addressId:
          type: string
        addressLine1:
          type:
          - string
          - 'null'
        addressLine2:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
        countryCode:
          type:
          - string
          - 'null'
        postalCode:
          type:
          - string
          - 'null'
      required:
      - addressId
      - addressLine1
      - postalCode
    company:
      type: object
      properties:
        companyId:
          type: string
        name:
          type: string
        registrationNumber:
          type: string
        addresses:
          type: object
          properties:
            corporateAddress:
              type:
              - object
              - 'null'
              $ref: '#/components/schemas/address'
            billingAddress:
              type:
              - object
              - 'null'
              $ref: '#/components/schemas/address'
      required:
      - companyId
      - name
      - registrationNumber
      - addresses
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
