openapi: 3.2.0
info:
  title: Endpoints Departments API
  version: v1
servers:
- url: https://api.oysterhr.com
  description: Production server
- url: https://api-sandbox.oysterhr.com
  description: Sandbox server
tags:
- name: Departments
paths:
  /v1/departments:
    get:
      summary: Retrieve all departments
      tags:
      - Departments
      description: Returns a list of departments
      security:
      - bearer_auth:
        - read
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                No departments:
                  value:
                    data: []
                    meta:
                      items: 100
                      count: 0
                      page: 1
                      pages: 1
                      firstUrl: /v1/departments?perPage=100&page=1
                      lastUrl: /v1/departments?perPage=100&page=1
                      pageUrl: /v1/departments?perPage=100&page=1
                      nextUrl: /v1/departments?perPage=100&page=
                      prevUrl: /v1/departments?perPage=100&page=
                Successful:
                  value:
                    data:
                    - id: Ee916f2a
                      departmentId: Ee916f2a
                      name: Garden
                      description: Cardigan sriracha quinoa chicharrones pug.
                      engagementsCount: 0
                    - id: D3782273
                      departmentId: D3782273
                      name: Jewelry & Health
                      description: Truffaut cronut gentrify flexitarian.
                      engagementsCount: 0
                    - id: Cc858c55
                      departmentId: Cc858c55
                      name: Games, Clothing & Beauty
                      description: Marfa bushwick chia art party narwhal normcore dreamcatcher.
                      engagementsCount: 0
                    - id: Be0ac9bc
                      departmentId: Be0ac9bc
                      name: Toys, Movies & Grocery
                      description: Phlogiston pop-up ethical banjo tousled sriracha retro.
                      engagementsCount: 0
                    - id: A6f6b028
                      departmentId: A6f6b028
                      name: Industrial
                      description: Cardigan fanny pack keffiyeh 3 wolf moon pour-over before they sold out mustache.
                      engagementsCount: 0
                    meta:
                      items: 100
                      count: 5
                      page: 1
                      pages: 1
                      firstUrl: /v1/departments?perPage=100&page=1
                      lastUrl: /v1/departments?perPage=100&page=1
                      pageUrl: /v1/departments?perPage=100&page=1
                      nextUrl: /v1/departments?perPage=100&page=
                      prevUrl: /v1/departments?perPage=100&page=
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/departments'
                  meta:
                    $ref: '#/components/schemas/meta'
                required:
                - data
                - meta
      operationId: getV1Departments
      x-operation-id-source: derived
components:
  schemas:
    meta:
      type: object
      properties:
        items:
          type: integer
        count:
          type: integer
        page:
          type: integer
        pages:
          type: integer
        firstUrl:
          type: string
        lastUrl:
          type: string
        pageUrl:
          type: string
        nextUrl:
          type: string
        prevUrl:
          type: string
        deprecation:
          type: object
          properties:
            at:
              type: string
            sunset:
              type: string
            link:
              type: object
              properties:
                rel:
                  type: string
                url:
                  type: string
      required:
      - items
      - count
      - page
      - pages
      - firstUrl
      - lastUrl
      - pageUrl
      - nextUrl
      - prevUrl
    departments:
      type: array
      items:
        $ref: '#/components/schemas/department'
    department:
      type: object
      properties:
        departmentId:
          type: string
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        engagementsCount:
          type: integer
      required:
      - departmentId
      - name
      - description
      - engagementsCount
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
