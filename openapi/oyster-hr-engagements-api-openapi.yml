components:
  schemas:
    address:
      type: object
      properties:
        addressId:
          type: string
        addressLine1:
          type:
          - string
          - 'null'
        addressLine2:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
        countryCode:
          type:
          - string
          - 'null'
        postalCode:
          type:
          - string
          - 'null'
      required:
      - addressId
      - addressLine1
      - postalCode
    engagement:
      type: object
      properties:
        engagementId:
          type: string
        modifiedAt:
          type: string
          format: date-time
        startDate:
          type: string
          format: date
        engagementType:
          enum:
          - EMPLOYMENT
          - CONTRACT
        state:
          type: string
        role:
          type: string
        countryCode:
          type: string
        personalDetails:
          type: object
          properties:
            name:
              type:
              - string
              - 'null'
            addresses:
              type: object
              properties:
                livingAddress:
                  type:
                  - object
                  - 'null'
                  $ref: '#/components/schemas/address'
                mailingAddress:
                  type:
                  - object
                  - 'null'
                  $ref: '#/components/schemas/address'
            citizenships:
              type: array
              items:
                type:
                - string
                - 'null'
            dateOfBirth:
              type:
              - string
              - 'null'
            phoneNumbers:
              type: object
              properties:
                default:
                  type:
                  - object
                  - 'null'
                  $ref: '#/components/schemas/phoneNumber'
                emergency:
                  type:
                  - object
                  - 'null'
                  $ref: '#/components/schemas/phoneNumber'
          required:
          - name
          - addresses
        employment:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            employmentId:
              type: string
            fullLegalName:
              type:
              - string
              - 'null'
            email:
              type:
              - string
              - 'null'
            workEmail:
              type:
              - string
              - 'null'
            employmentType:
              type:
              - string
              - 'null'
              enum:
              - FULL-TIME
              - PART-TIME
            type:
              type:
              - string
              - 'null'
              enum:
              - FULL-TIME
              - PART-TIME
            lastDayOn:
              type:
              - string
              - 'null'
              format: date
            salary:
              $ref: '#/components/schemas/amount'
            payrollTeamMember:
              type: boolean
          required:
          - id
          - employmentId
          - fullLegalName
          - email
          - workEmail
          - employmentType
          - type
          - lastDayOn
          - salary
          - payrollTeamMember
        contract:
          type:
          - object
          - 'null'
          properties:
            id:
              type:
              - string
              - 'null'
            contractId:
              type:
              - string
              - 'null'
            name:
              type:
              - string
              - 'null'
            email:
              type:
              - string
              - 'null'
            workEmail:
              type:
              - string
              - 'null'
            billingType:
              type:
              - string
              - 'null'
              enum:
              - FIXED
              - PAY_AS_YOU_GO
              - MILESTONE
            taxIdNumber:
              type:
              - string
              - 'null'
          required:
          - id
          - contractId
          - name
          - email
          - workEmail
          - billingType
          - taxIdNumber
        benefitEnrollments:
          type: array
          items:
            type: object
            properties:
              benefitEnrollmentId:
                type: string
              plan:
                type: object
                properties:
                  provider:
                    type: string
                  descriptiveName:
                    type: string
              name:
                type: string
              state:
                type: string
        terminations:
          type: array
          items:
            type: object
            properties:
              state:
                type: string
              proposedDate:
                type: string
                format: date
        department:
          type:
          - object
          - 'null'
          properties:
            departmentId:
              type: string
            name:
              type: string
            description:
              type: string
      required:
      - engagementId
      - engagementType
      - personalDetails
      - startDate
      - countryCode
      - role
    baseCompensation:
      type: object
      properties:
        label:
          enum:
          - COMMISSION_AMOUNT
          - COMMISSION_PERCENTAGE
          - END_OF_YEAR
          - HOLIDAY_BONUS
          - PERFORMANCE
          - RETENTION
          - SIGN_ON_BONUS
          - VACATION_BONUS
          - HEALTH_AND_WELLBEING
          - LEARNING_DEVELOPMENT
          - SUSTENANCE
          - TRAVEL
        paymentFrequency:
          enum:
          - MONTHLY
          - QUARTERLY
          - BIANNUAL
          - YEARLY
          - ONE_TIME
        statutory:
          type: boolean
        amountDecimal:
          type: string
          pattern: ^[0-9]+(\.[0-9]{2,})?$
        selectedMonths:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 12
      required:
      - label
      - paymentFrequency
      - statutory
      - selectedMonths
    bonuses:
      type: array
      items:
