                            description: This allowance will be automatically added to each payroll
                          - value: ONE_TIME_STIPEND
                            title: One-time stipend (first-month payment)
                            description: This allowance will be automatically added to the first payroll.
                          - value: BASIC_REIMBURSEMENT
                            title: Expense reimbursement
                            description: Team Members must submit expense reimbursement requests through the platform.
                          - value: NO_REIMBURSEMENT
                            title: No reimbursement
                            description: No payment
                      rules:
                        post: {}
                        put:
                          allOf:
                          - properties:
                              role:
                                allOf:
                                - properties:
                                    startDate:
                                      earliest: '2022-10-29'
                                - if:
                                    required:
                                    - initialStartDate
                                  then:
                                    properties:
                                      initialStartDate:
                                        latestRef: startDate
                          - properties:
                              compensation:
                                properties:
                                  bonuses:
                                    items:
                                      allOf:
                                      - if:
                                          properties:
                                            label:
                                              const: SIGN_ON_BONUS
                                        then:
                                          not:
                                            required:
                                            - prorated
                                        else:
                                          required:
                                          - prorated
                                      - if:
                                          properties:
                                            paymentFrequency:
                                              const: YEARLY
                                        then:
                                          properties:
                                            selectedMonths:
                                              minItems: 1
                                          required:
                                          - selectedMonths
                                        else:
                                          not:
                                            required:
                                            - selectedMonths
                                      - oneOf:
                                        - required:
                                          - amountDecimal
                                        - required:
                                          - amountAsPercentage
                                      - if:
                                          properties:
                                            label:
                                              const: COMMISSION_AMOUNT
                                        then:
                                          properties:
                                            guaranteed:
                                              enum:
                                              - false
                                          required:
                                          - amountDecimal
                                      - if:
                                          properties:
                                            label:
                                              const: COMMISSION_PERCENTAGE
                                        then:
                                          properties:
                                            guaranteed:
                                              enum:
                                              - false
                                          required:
                                          - amountAsPercentage
                                      - if:
                                          properties:
                                            label:
                                              const: SIGN_ON_BONUS
                                        then:
                                          properties:
                                            guaranteed:
                                              enum:
                                              - true
                                            paymentFrequency:
                                              enum:
                                              - ONE_TIME
                                          required:
                                          - amountAsPercentage
                                      - if:
                                          properties:
                                            label:
                                              const: END_OF_YEAR
                                        then:
                                          properties:
                                            paymentFrequency:
                                              enum:
                                              - YEARLY
                          - properties:
                              compensation:
                                properties:
                                  allowances:
                                    items:
                                      allOf:
                                      - if:
                                          properties:
                                            paymentFrequency:
                                              const: YEARLY
                                        then:
                                          properties:
                                            selectedMonths:
                                              minItems: 1
                                          required:
                                          - selectedMonths
                                        else:
                                          not:
                                            required:
                                            - selectedMonths
                          - properties:
                              role:
                                allOf:
                                - if:
                                    properties:
                                      employmentType:
                                        const: FULL_TIME
                                  then:
                                    required:
                                    - fullTimeHoursPerWeek
                                    properties:
                                      fullTimeHoursPerWeek:
                                        minimum: 40
                                        maximum: 56
                                - if:
                                    properties:
                                      employmentType:
                                        const: PART_TIME
                                  then:
                                    required:
                                    - partTimeDaysPerWeek
                                    - partTimeHoursPerDay
                                    oneOf:
                                    - properties:
                                        partTimeDaysPerWeek:
                                          const: 1
                                        partTimeHoursPerDay:
                                          maximum: 40
                                    - properties:
                                        partTimeDaysPerWeek:
                                          const: 2
                                        partTimeHoursPerDay:
                                          maximum: 20
                                    - properties:
                                        partTimeDaysPerWeek:
                                          const: 3
                                        partTimeHoursPerDay:
                                          maximum: 13.3
                                    - properties:
                                        partTimeDaysPerWeek:
                                          const: 4
                                        partTimeHoursPerDay:
                                          maximum: 10
                                    - properties:
                                        partTimeDaysPerWeek:
                                          const: 5
                                        partTimeHoursPerDay:
                                          maximum: 8
                                    - properties:
                                        partTimeDaysPerWeek:
                                          const: 6
                                        partTimeHoursPerDay:
                                          maximum: 6.7
                                    - properties:
                                        partTimeDaysPerWeek:
                                          const: 7
                                        partTimeHoursPerDay:
                                          maximum: 5.7
                          - properties:
                              role:
                                properties:
                                  probationPeriod:
                                    oneOf:
                                    - properties:
                                        unit:
                                          const: DAYS
                                        value:
                                          maximum: 365
                                    - properties:
                                        unit:
                                          const: WEEKS
                                        value:
                                          maximum: 52
                                    - properties:
                                        unit:
                                          const: MONTHS
                                        value:
                                          maximum: 12
                          - properties:
                              compensation:
                                properties:
                                  remoteWorkCosts:
                                    allOf:
                                    - if:
                                        required:
                                        - equipmentListOwnedByTeamMember
                                      then:
                                        not:
                                          required:
                                          - equipmentListProvidedByCustomer
                                    - if:
                                        required:
                                        - equipmentListProvidedByCustomer
                                      then:
                                        not:
                                          required:
                                          - equipmentListOwnedByTeamMember
                                    - if:
                                        required:
                                        - equipmentBudget
                                      then:
                                        not:
                                          required:
                                          - equipmentOneTimePayment
                                    - if:
                                        required:
                                        - equipmentOneTimePayment
                                      then:
                                        not:
                                          required:
                                          - equipmentBudget
                                    - allowancePolicy:
                                        allowancePolicy:
                                          enum:
                                          - BASIC_REIMBURSEMENT
                                          - ONE_TIME_STIPEND
                                          - MONTHLY_ALLOWANCE
                                          - NO_REIMBURSEMENT
                                    - if:
                                        allowancePolicy:
                                          allowancePolicy:
                                            enum:
                                            - BASIC_REIMBURSEMENT
                                            - NO_REIMBURSEMENT
                                      then:
                                        allowancePolicy:
                                          not:
                                            required:
                                            - amountDecimal
                          - properties:
                              compensation:
                                not:
                                  required:
                                  - sickPay
