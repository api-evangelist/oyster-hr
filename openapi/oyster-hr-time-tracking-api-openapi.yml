                      statusReason: null
                      locked: false
                      isAmendment: false
                      hasAmendmentTimeSheet: false
                      amendmentTimeSheetId: null
                      originalTimeSheetId: null
                      createdBy: TEAM_MEMBER
                      submittedBy: null
                      confirmedBy: null
                      flexibleWorkArrangement: false
                      workSummary:
                      - type: REGULAR
                        duration:
                          hours: 35
                          minutes: 0
                      totals:
                        worked:
                          hours: 35
                          minutes: 0
                        workedOnHolidays:
                          hours: 0
                          minutes: 0
                        workedOnWeekends:
                          hours: 0
                          minutes: 0
                        workedOnWeekdays:
                          hours: 35
                          minutes: 0
                        notWorked:
                          hours: 213
                          minutes: 0
                        timeOff:
                          hours: 0
                          minutes: 0
                      timeOffs: []
                      entries:
                      - id: B56fa57c
                        timeSheetId: A4338e26
                        date: '2022-10-03'
                        type: REGULAR
                        notes: null
