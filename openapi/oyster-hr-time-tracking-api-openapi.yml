                      type: string
                      pattern: ^(0?[1-9]|1[0-2])$
                    year:
                      type: string
                      pattern: ^\d{4}$
                    day:
                      type: string
                      pattern: ^(0?[1-9]|[12][0-9]|3[01])$
                  required:
                  - month
                  - year
                workSchedule:
                  type: object
                  properties:
