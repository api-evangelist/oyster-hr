openapi: 3.2.0
info:
  title: Endpoints Time Tracking API
  version: v1
servers:
- url: https://api.oysterhr.com
  description: Production server
- url: https://api-sandbox.oysterhr.com
  description: Sandbox server
tags:
- name: Time Tracking
paths:
  /v1/time_tracking/rulesets/{engagement_id}:
    get:
      summary: Retrieve time tracking rulesets for engagement
      tags:
      - Time Tracking
      description: 'Retrieves the rulesets for a specific engagement, which includes work schedules and entry types.


        - Use the `engagement_id` path parameter to fetch relevant rulesets for an engagement.

        - The rulesets include both work schedules and entry types, which are essential for managing time tracking.


        Typical use case:

        - Retrieving rulesets when creating new time sheet for an engagement.'
      security:
      - bearer_auth:
        - read
      parameters:
      - name: engagement_id
        in: path
        description: Engagement ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      rulesetId: A5540727
                      scope: {}
                      schemas: {}
                      sources:
                        entryTypes:
                          data:
                          - value: REGULAR
                            title: Regular hours
                          - value: OVERTIME
                            title: Overtime
                          - value: NIGHT_WORK
                            title: Night work
                          - value: ON_CALL
                            title: On-call
                          - value: ON_CALL_ACTIVE
                            title: On-call active
                          - value: ON_CALL_PASSIVE
                            title: On-call passive
                        workSchedule:
                          data:
                            weekly:
                            - day: MONDAY
                              type: REGULAR
                              present:
                                fromTime: '1970-01-01T09:00:00Z'
                                toTime: '1970-01-01T18:00:00Z'
                              breakInterval:
                                fromTime: '1970-01-01T12:00:00Z'
                                toTime: '1970-01-01T13:00:00Z'
                            - day: TUESDAY
                              type: REGULAR
                              present:
                                fromTime: '1970-01-01T09:00:00Z'
                                toTime: '1970-01-01T18:00:00Z'
                              breakInterval:
                                fromTime: '1970-01-01T12:00:00Z'
                                toTime: '1970-01-01T13:00:00Z'
                            - day: WEDNESDAY
                              type: REGULAR
                              present:
                                fromTime: '1970-01-01T09:00:00Z'
                                toTime: '1970-01-01T18:00:00Z'
                              breakInterval:
                                fromTime: '1970-01-01T12:00:00Z'
                                toTime: '1970-01-01T13:00:00Z'
                            - day: THURSDAY
                              type: REGULAR
                              present:
                                fromTime: '1970-01-01T09:00:00Z'
                                toTime: '1970-01-01T18:00:00Z'
                              breakInterval:
                                fromTime: '1970-01-01T12:00:00Z'
                                toTime: '1970-01-01T13:00:00Z'
                            - day: FRIDAY
                              type: REGULAR
                              present:
                                fromTime: '1970-01-01T09:00:00Z'
                                toTime: '1970-01-01T18:00:00Z'
                              breakInterval:
                                fromTime: '1970-01-01T12:00:00Z'
                                toTime: '1970-01-01T13:00:00Z'
                      rules: {}
      operationId: getV1TimeTrackingRulesetsByEngagementId
      x-operation-id-source: derived
  /v1/time_tracking/rulesets/{engagement_id}/sources/{source_type}:
    get:
      summary: Retrieve time tracking sources by source type for engagement
      tags:
      - Time Tracking
      description: 'Retrieves time tracking sources for a specific engagement and source type.


        - Use the `engagement_id` and `source_type` path parameters to fetch relevant sources for an engagement.

        - For creating a time sheet, both work schedules and entry types are required.

        - When updating time sheet entries, only entry types are needed, this endpoint provides the necessary data.


        Typical use case:

        - Retrieving entry types when modifying existing time sheet entries.'
      security:
      - bearer_auth:
        - read
      parameters:
      - name: engagement_id
        in: path
        description: Engagement ID
        required: true
        schema:
          type: string
      - name: source_type
        in: path
        schema:
          type: string
          enum:
          - entry_types
          - work_schedule
        description: Source type to retrieve
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                    - value: REGULAR
                      title: Regular hours
                    - value: OVERTIME
                      title: Overtime
                    - value: NIGHT_WORK
                      title: Night work
                    - value: ON_CALL
                      title: On-call
                    - value: ON_CALL_ACTIVE
                      title: On-call active
                    - value: ON_CALL_PASSIVE
                      title: On-call passive
      operationId: getV1TimeTrackingRulesetsByEngagementIdSourcesBySourceType
      x-operation-id-source: derived
  /v1/time_tracking/time_sheets:
    get:
      summary: Retrieve all time sheets
      tags:
      - Time Tracking
      description: Returns all Time Sheets for a company.
      security:
