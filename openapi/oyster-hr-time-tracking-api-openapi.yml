                            - OVERTIME
                            - NIGHT_WORK
                            - ON_CALL
                            - ON_CALL_ACTIVE
                            - ON_CALL_PASSIVE
                          present:
                            type: object
                            properties:
                              fromTime:
                                type: string
                                pattern: ^\d{2}:\d{2}$
                              toTime:
                                type: string
                                pattern: ^\d{2}:\d{2}$
