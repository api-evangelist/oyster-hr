  /v1/time_tracking/time_sheets/entries:
    post:
      summary: Create time sheet entry
      tags:
      - Time Tracking
      description: This API endpoint allows you to create a new time sheet entry and receive a complete response with the created entry details.
      security:
      - bearer_auth:
        - manage
      parameters: []
      responses:
        '200':
          description: Successfully created time sheet entry
          content:
            application/json:
              examples:
                Successfully created time sheet entry:
                  value:
                    data:
                      id: A20a2969
                      timeSheetId: A4338e26
                      date: '2022-10-03'
                      type: REGULAR
                      notes: Worked on feature X
                      present:
                        fromTime: '2022-10-03T09:00:00Z'
                        toTime: '2022-10-03T17:00:00Z'
                        duration:
                          hours: 8
                          minutes: 0
                      breakInterval:
                        fromTime: '2022-10-03T12:00:00Z'
                        toTime: '2022-10-03T12:30:00Z'
                        duration:
                          hours: 0
                          minutes: 30
                      workDuration:
                        hours: 7
                        minutes: 30
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/timeTrackingTimeSheetEntry'
                required:
                - data
        '422':
          description: Unprocessable entity
          content:
            application/json:
              examples:
                Unprocessable entity:
                  value:
                    errors:
                    - message: 'Time sheet entry type must be one of: REGULAR, OVERTIME, NIGHT_WORK'
              schema:
                $ref: '#/components/schemas/errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeSheetId:
                  type: string
                  minLength: 1
                  pattern: ^[\w+\-]{8,9}$
                date:
                  type: string
                  minLength: 1
                  pattern: ^\d{4}-\d{2}-\d{2}$
                type:
                  type: string
                  minLength: 1
                  enum:
                  - REGULAR
                  - OVERTIME
                  - NIGHT_WORK
                  - ON_CALL
                  - ON_CALL_ACTIVE
                  - ON_CALL_PASSIVE
                notes:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                present:
                  type: object
                  properties:
                    fromTime:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                    toTime:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                  required:
                  - fromTime
                  - toTime
                breakInterval:
                  type:
                  - object
                  - 'null'
                  properties:
                    fromTime:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                    toTime:
                      type: string
                      pattern: ^\d{2}:\d{2}$
              required:
              - timeSheetId
              - date
              - type
              - present
            examples:
              Successfully created time sheet entry:
                summary: Successfully created time sheet entry
                value:
                  timeSheetId: A4338e26
                  date: '2022-10-03'
                  type: REGULAR
                  notes: Worked on feature X
                  present:
                    fromTime: 09:00
                    toTime: '17:00'
                  breakInterval:
                    fromTime: '12:00'
                    toTime: '12:30'
      operationId: postV1TimeTrackingTimeSheetsEntries
      x-operation-id-source: derived
  /v1/time_tracking/time_sheets/entries/{id}:
    patch:
      summary: Update time sheet entry
      tags:
      - Time Tracking
      description: This API endpoint allows you to update an existing time sheet entry and receive a complete response with the updated entry details.
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: id
        in: path
        description: Time Sheet Entry ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully updated time sheet entry
          content:
            application/json:
              examples:
                Successfully updated time sheet entry:
                  value:
                    data:
                      id: A20a2969
                      timeSheetId: A4338e26
                      date: '2022-10-01'
                      type: REGULAR
                      notes: Updated notes
                      present:
                        fromTime: '2022-10-01T10:00:00Z'
                        toTime: '2022-10-01T18:00:00Z'
                        duration:
                          hours: 8
                          minutes: 0
                      breakInterval:
                        fromTime: '2022-10-01T13:00:00Z'
                        toTime: '2022-10-01T13:30:00Z'
                        duration:
                          hours: 0
                          minutes: 30
                      workDuration:
                        hours: 7
                        minutes: 30
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/timeTrackingTimeSheetEntry'
                required:
                - data
        '422':
          description: Unprocessable entity
          content:
            application/json:
              examples:
                Unprocessable entity:
                  value:
                    errors:
                    - message: 'Time sheet entry type must be one of: REGULAR, OVERTIME, NIGHT_WORK'
              schema:
                $ref: '#/components/schemas/errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  minLength: 1
                  enum:
                  - REGULAR
                  - OVERTIME
                  - NIGHT_WORK
                  - ON_CALL
                  - ON_CALL_ACTIVE
                  - ON_CALL_PASSIVE
                notes:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                present:
                  type: object
                  properties:
                    fromTime:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                    toTime:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                  required:
                  - fromTime
                  - toTime
                breakInterval:
                  type:
                  - object
                  - 'null'
                  properties:
                    fromTime:
                      type: string
                      pattern: ^\d{2}:\d{2}$
                    toTime:
                      type: string
                      pattern: ^\d{2}:\d{2}$
              required:
              - type
              - present
            examples:
              Successfully updated time sheet entry:
                summary: Successfully updated time sheet entry
                value:
                  type: REGULAR
                  notes: Updated notes
                  present:
                    fromTime: '10:00'
                    toTime: '18:00'
                  breakInterval:
                    fromTime: '13:00'
                    toTime: '13:30'
      operationId: patchV1TimeTrackingTimeSheetsEntriesById
      x-operation-id-source: derived
    delete:
      summary: Delete time sheet entry
      tags:
      - Time Tracking
      description: This API endpoint allows you to delete an existing time sheet entry.
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: id
        in: path
        description: Time Sheet Entry ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully deleted time sheet entry
        '422':
          description: Unprocessable entity
          content:
            application/json:
              examples:
                Unprocessable entity:
                  value:
                    errors:
                    - message: Time sheet is locked and cannot be modified.
              schema:
                $ref: '#/components/schemas/errors'
      operationId: deleteV1TimeTrackingTimeSheetsEntriesById
      x-operation-id-source: derived
  /v1/time_tracking/time_sheets/{id}:
    get:
      summary: Retrieve an individual time sheet
      tags:
      - Time Tracking
      description: Returns details for a time sheet.
      security:
      - bearer_auth:
        - read
      parameters:
      - name: id
        in: path
        description: Time sheet ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      id: A4338e26
                      engagement:
                        engagementId: A5540727
                        name: Margery Wolf
                        type: EMPLOYMENT
                        countryCode: US
                      timePeriod:
                        startDate: '2022-10-01'
                        endDate: '2022-10-31'
                        year: '2022'
                        month: '10'
                      cadence: MONTHLY
                      status: PENDING_SUBMISSION
                      statusReason: null
                      locked: false
                      isAmendment: false
                      hasAmendmentTimeSheet: false
                      amendmentTimeSheetId: null
