                                type: string
                                pattern: ^\d{2}:\d{2}$
                              toTime:
                                type: string
                                pattern: ^\d{2}:\d{2}$
                        required:
                        - day
                        - type
                        - present
                  required:
                  - weekly
                setAsDefault:
                  type: boolean
              required:
              - engagementId
            examples:
              Successful:
                summary: Successful
                value:
                  engagementId: A5540727
                  timePeriod:
                    month: '10'
                    year: '2022'
                  workSchedule:
                    weekly:
                    - day: MONDAY
                      type: REGULAR
                      present:
                        fromTime: 09:00
                        toTime: '16:00'
                  set_as_default: true
      operationId: postV1TimeTrackingTimeSheets
