info:
  title: Endpoints Benefits API
  version: v1
servers:
- url: https://api.oysterhr.com
  description: Production server
- url: https://api-sandbox.oysterhr.com
  description: Sandbox server
tags:
- name: Benefits
paths:
  /v1/benefits/engagements/{engagement_id}/enrollments:
    post:
      summary: Request benefits
      tags:
      - Benefits
      description: Provisions benefits for an engagement.
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: engagement_id
        in: path
        description: engagement ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully requests benefits enrollment
          content:
            application/json:
              examples:
                Successfully requests benefits enrollment:
                  value:
                    data:
                      id: A8084119
                      plan:
                        id: A4d58b0f
                        link: http://example.com
                        name: Pension
                        providerName: Test nationale nederlanden
                        category: PENSION
                        guideUrl: http://example.com/guide
                        estimatedPrice: null
                        costSplitAllowed: true
                        dependentsConfig: ALLOWED
                        maxDependents: 0
                        minEmployerContribution: 0
                        supportedEngagementTypes:
                        - EMPLOYMENT
                        - CONTRACT
                        supportedEorTypes:
                        - DIRECT
                        - INDIRECT
                        mandatory: false
                        fee: null
                      package: null
                      state: REQUESTED
                      employerContribution:
                        dependents: 0.35
                        maxDependentsCovered: 6
                        teamMember: 0.55
                      totalCost: null
                      totalEmployerContributionCost: null
                      coveragePeriod:
                        fromDate: '2022-10-15'
                        toDate: null
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/enrollment'
                required:
                - data
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                planId:
                  type: string
                  minLength: 1
                  pattern: ^[\w+\-]{8,9}$
                employerContribution:
                  type: object
                  properties:
                    teamMember:
                      type: number
                      minimum: 0
                      maximum: 100
                    dependents:
                      type: number
                      minimum: 0
                      maximum: 100
                    maxDependentsCovered:
                      type: integer
                      minimum: 0
              required:
              - planId
            examples:
              Successfully requests benefits enrollment:
                summary: Successfully requests benefits enrollment
                value:
                  plan_id: A4d58b0f
                  employer_contribution:
                    team_member: 0.55
                    max_dependents_covered: 6
                    dependents: 0.35
      operationId: postV1BenefitsEngagementsByEngagementIdEnrollments
      x-operation-id-source: derived
  /v1/benefits/engagements/{engagement_id}/offerings:
    get:
      summary: Retrieve an employment's available benefits offerings
