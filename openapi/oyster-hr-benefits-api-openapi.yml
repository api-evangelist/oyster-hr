  /v1/benefits/ruleset:
    get:
      summary: Retrieve benefits ruleset
      tags:
      - Benefits
      description: Returns the rules and restrictions that will be applied to requests for the benefits provisioning.
      security:
      - bearer_auth:
        - read
      responses:
        '200':
          description: 'Successfully retrieve the ruleset '
          content:
            application/json:
              examples:
                'Successfully retrieve the ruleset ':
                  value:
                    data:
                      rulesetId: DEFAULT
                      scope: {}
                      schemas:
                        put:
                          type: object
                          properties:
                            supplementary:
                              type: object
                              properties:
                                plansSettings:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      planId:
                                        type: string
                                        minLength: 1
                                        pattern: ^[\w+\-]{8,9}$
                                      employerContribution:
                                        type: object
                                        properties:
                                          teamMember:
                                            type: number
                                            minimum: 0
                                            maximum: 100
                                          dependents:
                                            type: number
                                            minimum: 0
                                            maximum: 100
                                          maxDependentsCovered:
                                            type: integer
                                            minimum: 0
                                        required: []
                                    required:
                                    - planId
                              required: []
                            package:
                              type: object
                              properties:
                                id:
                                  type: string
                                  minLength: 1
                                  pattern: ^[\w+\-]{8,9}$
                                plansSettings:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      planId:
                                        type: string
                                        pattern: ^[\w+\-]{8,9}$
                                      employerContribution:
                                        type: object
                                        properties:
                                          teamMember:
                                            type: number
                                            minimum: 0
                                            maximum: 100
                                          dependents:
                                            type: number
                                            minimum: 0
                                            maximum: 100
                                          maxDependentsCovered:
                                            type: integer
                                            minimum: 0
                                        required: []
                                    required:
                                    - planId
                              required:
                              - id
                          required: []
                        post:
                          type: object
                          properties:
                            planId:
                              type: string
                              minLength: 1
                              pattern: ^[\w+\-]{8,9}$
                            employerContribution:
                              type: object
                              properties:
                                teamMember:
                                  type: number
                                  minimum: 0
                                  maximum: 100
                                dependents:
                                  type: number
                                  minimum: 0
                                  maximum: 100
                                maxDependentsCovered:
                                  type: integer
                                  minimum: 0
                              required: []
                          required:
                          - planId
                      sources:
                        categories:
                          params: {}
      operationId: getV1BenefitsRuleset
      x-operation-id-source: derived
components:
  schemas:
    benefitPlan:
      properties:
        category:
          type: string
        estimatedPrice:
          type:
          - object
          - 'null'
          properties:
            currencyCode:
              type: string
              minLength: 3
              maxLength: 3
            decimal:
              type: string
              pattern: ^\d+([.]\d+)?$
          required:
          - currencyCode
          - decimal
        fee:
          type:
          - object
          - 'null'
          properties:
            currencyCode:
              type: string
              minLength: 3
              maxLength: 3
            decimal:
              type: string
              pattern: ^\d+([.]\d+)?$
          required:
          - currencyCode
          - decimal
        guideUrl:
          type: string
        id:
          type: string
        link:
          type: string
        name:
          type: string
    benefitsOffering:
      properties:
        supplementary:
          type: object
          properties:
            plans:
              type: array
              items:
                $ref: '#/components/schemas/benefitPlan'
        packages:
          type: array
          items:
            $ref: '#/components/schemas/benefitPackage'
    enrollment:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
        plan:
          $ref: '#/components/schemas/benefitPlan'
        package:
          $ref: '#/components/schemas/benefitPackage'
        employerContribution:
          type:
          - object
          - 'null'
          properties:
            dependents:
              type:
              - number
              - 'null'
            max_dependents_covered:
              type:
              - number
              - 'null'
            teamMember:
              type:
              - number
              - 'null'
        totalCost:
          type:
          - object
          - 'null'
          properties:
            decimal:
              type: string
              pattern: ^\d+([.]\d+)?$
            currencyCode:
              type: string
              minLength: 3
              maxLength: 3
        totalEmployerContributionCost:
          type:
          - object
          - 'null'
          properties:
            decimal:
              type: string
              pattern: ^\d+([.]\d+)?$
            currencyCode:
              type: string
              minLength: 3
              maxLength: 3
        coveragePeriod:
          type:
          - object
          - 'null'
          properties:
            fromDate:
              type:
              - string
              - 'null'
              format: date
            toDate:
              type:
              - string
              - 'null'
              format: date
    benefitPackage:
      properties:
        id:
          type: string
        fee:
          type:
          - object
          - 'null'
          properties:
            currencyCode:
              type: string
              minLength: 3
              maxLength: 3
            decimal:
              type: string
              pattern: ^\d+([.]\d+)?$
        name:
          type: string
        plans:
          type: array
          items:
            $ref: '#/components/schemas/benefitPlan'
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
