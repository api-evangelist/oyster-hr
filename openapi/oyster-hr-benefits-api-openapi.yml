  /v1/benefits/enrollments/{id}:
    get:
      summary: Retrieve an enrollment
      tags:
      - Benefits
      description: Returns a list of benefits for an enrollment with a given ID.
      security:
      - bearer_auth:
        - read
      parameters:
      - name: id
        in: path
        description: Enrollment ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      id: A8084119
                      plan:
                        id: A4d58b0f
                        link: http://example.com
                        name: Standard
                        providerName: Safety Wing
                        category: HEALTH
                        guideUrl: http://example.com/guide
                        estimatedPrice:
                          decimal: '70.00'
                          currencyCode: EUR
                        costSplitAllowed: false
                        dependentsConfig: ALLOWED
                        maxDependents: 0
                        minEmployerContribution: 0
                        supportedEngagementTypes:
                        - EMPLOYMENT
                        - CONTRACT
                        supportedEorTypes:
                        - DIRECT
                        - INDIRECT
                        mandatory: false
                        fee: null
                      package: null
                      state: ENROLLED
                      employerContribution:
                        dependents: 100
                        maxDependentsCovered: null
                        teamMember: 100
                      totalCost:
                        decimal: '10.0'
                        currencyCode: EUR
                      totalEmployerContributionCost:
                        decimal: '10.0'
                        currencyCode: EUR
                      coveragePeriod:
                        fromDate: '2022-10-10'
                        toDate: null
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/enrollment'
                required:
                - data
