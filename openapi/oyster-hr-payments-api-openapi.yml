openapi: 3.2.0
info:
  title: Endpoints Payments API
  version: v1
servers:
- url: https://api.oysterhr.com
  description: Production server
- url: https://api-sandbox.oysterhr.com
  description: Sandbox server
tags:
- name: Payments
paths:
  /v1/payments/charge_groups:
    get:
      summary: Retrieve all charge groups
      tags:
      - Payments
      description: Returns detailed information about all charge groups for the company
      security:
      - bearer_auth:
        - read
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: search_query
        in: query
        required: false
        description: Partial-match search against the charge groups reference code
        schema:
          type: string
      - name: created_from
        in: query
        required: false
        description: Return only charge groups created on or after this date (YYYY-MM-DD, inclusive)
        schema:
          type: string
      - name: created_to
        in: query
        required: false
        description: Return only charge groups created on or before this date (YYYY-MM-DD, inclusive)
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                    - id: Acf02f3d
                      referenceCode: OY-COMP-Acf02f3d-Gr-0000001
                      itemsCount: 3
                      state: PENDING
                      amount:
                        decimal: '242.28'
                        currencyCode: USD
                      createdAt: '2022-10-15T12:34:56Z'
                      wireSentAt: null
                      paidAt: null
                    meta:
                      items: 100
                      count: 1
                      page: 1
                      pages: 1
                      firstUrl: /v1/payments/charge_groups?page=1&perPage=100&searchQuery=&createdFrom=2000-01-01&createdTo=2100-01-01
                      lastUrl: /v1/payments/charge_groups?page=1&perPage=100&searchQuery=&createdFrom=2000-01-01&createdTo=2100-01-01
                      pageUrl: /v1/payments/charge_groups?page=1&perPage=100&searchQuery=&createdFrom=2000-01-01&createdTo=2100-01-01
                      nextUrl: /v1/payments/charge_groups?page=&perPage=100&searchQuery=&createdFrom=2000-01-01&createdTo=2100-01-01
                      prevUrl: /v1/payments/charge_groups?page=&perPage=100&searchQuery=&createdFrom=2000-01-01&createdTo=2100-01-01
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/paymentsGroups'
                required:
                - data
      operationId: getV1PaymentsChargeGroups
      x-operation-id-source: derived
  /v1/payments/charge_groups/{id}:
    get:
      summary: Retrieve a charge group
      tags:
      - Payments
      description: Returns detailed information about a specific charge group
      security:
      - bearer_auth:
        - read
      parameters:
      - name: id
        in: path
        required: true
        description: Charge group ID
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      id: Acf02f3d
                      referenceCode: OY-COMP-Acf02f3d-Gr-0000001
                      itemsCount: 3
                      state: PENDING
                      amount:
                        decimal: '726.55'
                        currencyCode: USD
                      createdAt: '2022-10-15T12:34:56Z'
                      wireSentAt: null
                      paidAt: null
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/paymentsGroup'
                required:
                - data
      operationId: getV1PaymentsChargeGroupsById
      x-operation-id-source: derived
  /v1/payments/charge_groups/{id}/charges:
    get:
      summary: Retrieve charge group charges
      tags:
      - Payments
      description: Retrieves all charges associated with a specific charge group
      security:
      - bearer_auth:
        - read
      parameters:
      - name: id
        in: path
        required: true
        description: Charge group ID
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                    - id: A857d642
                      status: WAITING_FOR_WIRE_TRANSFER
                      amount:
                        decimal: '68.30'
                        currencyCode: USD
                      amountDue:
                        decimal: '68.30'
                        currencyCode: USD
                      completedAt: null
                      collectionType: DIRECT_DEBIT
                      subject:
                        id: A01e1dad
                        type: INVOICE
                    - id: C1070889
                      status: WAITING_FOR_WIRE_TRANSFER
                      amount:
                        decimal: '83.48'
                        currencyCode: USD
                      amountDue:
                        decimal: '83.48'
                        currencyCode: USD
                      completedAt: null
                      collectionType: DIRECT_DEBIT
                      subject:
                        id: Ba234d31
                        type: INVOICE
                    - id: E9d2a753
                      status: WAITING_FOR_WIRE_TRANSFER
                      amount:
                        decimal: '90.50'
                        currencyCode: USD
                      amountDue:
                        decimal: '90.50'
                        currencyCode: USD
                      completedAt: null
                      collectionType: DIRECT_DEBIT
                      subject:
                        id: C743e99a
                        type: INVOICE
                    meta:
                      items: 100
                      count: 3
                      page: 1
                      pages: 1
                      firstUrl: /v1/payments/charge_groups/Acf02f3d/charges?page=1&perPage=100
                      lastUrl: /v1/payments/charge_groups/Acf02f3d/charges?page=1&perPage=100
                      pageUrl: /v1/payments/charge_groups/Acf02f3d/charges?page=1&perPage=100
                      nextUrl: /v1/payments/charge_groups/Acf02f3d/charges?page=&perPage=100
                      prevUrl: /v1/payments/charge_groups/Acf02f3d/charges?page=&perPage=100
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/paymentsGroupItems'
                required:
                - data
      operationId: getV1PaymentsChargeGroupsByIdCharges
      x-operation-id-source: derived
  /v1/payments/charge_groups/{id}/wire_sent:
    delete:
      summary: Revoke wire sent confirmation
      tags:
      - Payments
      description: Revoke wire sent confirmation for a charge group
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: id
        in: path
        description: Charge group ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      id: Acf02f3d
                      referenceCode: OY-COMP-Acf02f3d-Gr-0000001
                      itemsCount: 0
                      state: PENDING
                      amount:
                        decimal: '242.28'
                        currencyCode: USD
                      createdAt: '2022-10-15T12:34:56Z'
                      wireSentAt: null
                      paidAt: null
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/paymentsGroup'
                required:
                - data
        '422':
          description: Operation cannot be performed
          content:
            application/json:
              examples:
                Operation cannot be performed:
                  value:
                    errors:
                    - message: Charge group is not in wire sent state, It cannot be changed to pending.
              schema:
                $ref: '#/components/schemas/errors'
      operationId: deleteV1PaymentsChargeGroupsByIdWireSent
      x-operation-id-source: derived
    post:
      summary: Confirm wire sent
      tags:
      - Payments
      description: Confirm a wire was sent for a charge group
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: id
        in: path
        description: Charge group ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      id: Acf02f3d
                      referenceCode: OY-COMP-Acf02f3d-Gr-0000001
                      itemsCount: 3
                      state: WIRE_SENT
                      amount:
                        decimal: '242.28'
                        currencyCode: USD
                      createdAt: '2022-10-15T12:34:56Z'
                      wireSentAt: '2023-10-01T12:00:00Z'
                      paidAt: null
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/paymentsGroup'
                required:
                - data
        '422':
          description: Operation cannot be performed
          content:
            application/json:
              examples:
                Operation cannot be performed:
                  value:
                    errors:
                    - message: Charge group is not in pending state, It cannot be changed to wire sent.
              schema:
                $ref: '#/components/schemas/errors'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                wireSentAt:
                  type: string
                  format: date-time
                  description: The date and time when the wire transfer was sent, in ISO 8601 format
                  example: '2023-10-01T12:00:00Z'
              required:
              - wireSentAt
            examples:
              Successful:
                summary: Successful
                value:
                  wire_sent_at: '2023-10-01T12:00:00Z'
      operationId: postV1PaymentsChargeGroupsByIdWireSent
      x-operation-id-source: derived
  /v1/payments/charges/{id}:
    get:
      summary: Retrieve a charge
      tags:
      - Payments
      description: Returns detailed information about a specific charge
      security:
      - bearer_auth:
        - read
      parameters:
      - name: id
        in: path
        required: true
        description: Charge ID
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      id: A857d642
                      status: PAID
                      amount:
                        decimal: '1000.00'
                        currencyCode: USD
                      amountDue:
                        decimal: '0.00'
                        currencyCode: USD
                      completedAt: '2022-10-15T12:34:56Z'
                      collectionType: DIRECT_DEBIT
                      subject:
                        id: A01e1dad
                        type: INVOICE
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/chargeDetails'
                required:
                - data
      operationId: getV1PaymentsChargesById
      x-operation-id-source: derived
  /v1/payments/payouts/{id}:
    get:
      summary: Retrieve a payout
      tags:
      - Payments
      description: Returns detailed information about a specific payout
      security:
      - bearer_auth:
        - read
      parameters:
      - name: id
        in: path
        required: true
        description: Payout ID
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      id: A857d642
                      status: SENT
                      amount:
                        decimal: '1000.00'
                        currencyCode: USD
                      statusChanges: []
                      subject:
                        id: A01e1dad
                        type: INVOICE
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/payoutDetails'
                required:
                - data
      operationId: getV1PaymentsPayoutsById
      x-operation-id-source: derived
components:
  schemas:
    paymentsGroupItems:
      type: array
      items:
        $ref: '#/components/schemas/chargeDetails'
    payoutDetails:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - IN_PROGRESS
          - INITIATED
          - NOT_INITIATED
          - NO_PAYMENT
          - PAID
          - RETURNED
          - SENT
        amount:
          $ref: '#/components/schemas/paymentsAmount'
        statusChanges:
          type: array
          description: The timeline of the payout status changes.
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              to:
                type: string
                enum:
                - IN_PROGRESS
                - INITIATED
                - NOT_INITIATED
                - NO_PAYMENT
                - PAID
                - RETURNED
                - SENT
            required:
            - at
            - to
        subject:
          type: object
          description: The entity that is being paid out.
          properties:
            id:
              type: string
            type:
              type: string
          required:
          - id
          - type
      required:
      - id
      - status
      - amount
      - statusChanges
      - subject
    paymentsAmount:
      type: object
      description: Monetary amount with currency for payments.
      properties:
        decimal:
          type: string
          pattern: ^\d+([.]\d+)?$
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
      required:
      - decimal
      - currencyCode
    chargeDetails:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - NO_PAYMENT
          - PENDING
          - WAITING_FOR_WIRE_TRANSFER
          - OVERDUE
          - DIRECT_DEBIT_IN_PROGRESS
          - DIRECT_DEBIT_FAILED
          - CHARGED_BACK
          - PAID
          - PARTIALLY_PAID
          - VOIDED
        amount:
          $ref: '#/components/schemas/paymentsAmount'
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
        amountDue:
          $ref: '#/components/schemas/paymentsAmount'
        collectionType:
          type: string
          enum:
          - DIRECT_DEBIT
          - WIRE_TRANSFER
        subject:
          type: object
          description: The entity that is being charged.
          properties:
            id:
              type: string
            type:
              type: string
          required:
          - id
          - type
      required:
      - id
      - status
      - amount
      - completedAt
      - amountDue
      - collectionType
      - subject
    errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
            required:
            - message
      required:
      - errors
    paymentsGroups:
      type: array
      items:
        $ref: '#/components/schemas/paymentsGroup'
    paymentsGroup:
      type: object
      properties:
        id:
          type: string
        referenceCode:
          type: string
        itemsCount:
          type: integer
          description: The number of items included in this group.
        state:
          type: string
          enum:
          - PENDING
          - WIRE_SENT
          - PAID
          - PROCESSING
        amount:
          $ref: '#/components/schemas/amount'
        createdAt:
          type: string
          format: date-time
          description: The date and time when the payments group was created.
        wireSentAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the wire transfer was sent.
        paidAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the payment was confirmed as received.
      required:
      - id
      - referenceCode
      - itemsCount
      - state
      - amount
      - createdAt
      - wireSentAt
      - paidAt
    amount:
      type: object
      properties:
        decimal:
          type: string
          pattern: ^\d+([.]\d+)?$
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
      required:
      - decimal
      - currencyCode
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
