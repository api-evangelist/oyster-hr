            recipientStreet:
              type:
              - string
              - 'null'
            recipientZipPostCode:
              type:
              - string
              - 'null'
            recipientStateOrProvince:
              type:
              - string
              - 'null'
            intermediaryIban:
              type:
              - string
              - 'null'
            intermediaryBranchCode:
              type:
              - string
              - 'null'
            intermediaryAccountNumber:
              type:
              - string
              - 'null'
            intermediarySwiftBicCode:
              type:
              - string
              - 'null'
            contactNotes:
              type:
              - string
              - 'null'
            contactEmail:
              type:
              - string
