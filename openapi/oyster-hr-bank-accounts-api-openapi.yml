openapi: 3.2.0
info:
  title: Endpoints Bank Accounts API
  version: v1
servers:
- url: https://api.oysterhr.com
  description: Production server
- url: https://api-sandbox.oysterhr.com
  description: Sandbox server
tags:
- name: Bank Accounts
paths:
  /v1/bank_accounts:
    get:
      summary: Retrieve bank accounts
      tags:
      - Bank Accounts
      description: Returns TM bank accounts for a company.
      security:
      - bearer_auth:
        - read
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: engagement_id
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                    - engagementId: B0b779a8
                      bankAccountId: Bcfb72c6
                      payoutUsage: null
                      isPrimary: true
                      currencyCode: GBP
                      countryCode: GB
                      details:
                        bankAccountName: David Wallace
                        accountNumber: null
                        iban: GB29NWBK60161331926819
                        swiftBicCode: NWBKGB2LLIQ
                        branchCode: null
                        bankCode: null
                        recipientCity: West Jin
                        recipientStreet: 79630 Pollich Springs
                        recipientCountry: CO
                        recipientZipPostCode: '43826'
                        recipientStateOrProvince: SAN
                        intermediaryAccountNumber: null
                        intermediaryIban: null
                        intermediaryBranchCode: null
                        intermediarySwiftBicCode: null
                        contactNotes: null
                        contactEmail: null
                    - engagementId: A5540727
                      bankAccountId: Af7b1993
                      payoutUsage: null
                      isPrimary: true
                      currencyCode: USD
                      countryCode: US
                      details:
                        bankAccountName: David Wallace
                        accountNumber: '123456789012'
                        iban: null
                        swiftBicCode: null
                        branchCode: '071004200'
                        bankCode: null
                        recipientCity: Schuppehaven
                        recipientStreet: 22980 Greg Crossing
                        recipientCountry: TT
                        recipientZipPostCode: '51200'
                        recipientStateOrProvince: SFO
                        intermediaryAccountNumber: null
                        intermediaryIban: null
                        intermediaryBranchCode: null
                        intermediarySwiftBicCode: null
                        contactNotes: null
                        contactEmail: null
                    meta:
                      items: 10
                      count: 2
                      page: 1
                      pages: 1
                      firstUrl: /v1/bank_accounts?perPage=10&page=1&engagementId=
                      lastUrl: /v1/bank_accounts?perPage=10&page=1&engagementId=
                      pageUrl: /v1/bank_accounts?perPage=10&page=1&engagementId=
                      nextUrl: /v1/bank_accounts?perPage=10&page=&engagementId=
                      prevUrl: /v1/bank_accounts?perPage=10&page=&engagementId=
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/bankAccounts'
                  meta:
                    $ref: '#/components/schemas/meta'
                required:
                - data
                - meta
      operationId: getV1BankAccounts
      x-operation-id-source: derived
    post:
      summary: Create bank account
      tags:
      - Bank Accounts
      description: Creates a new bank account for an engagement. Returns newly created bank account
      security:
      - bearer_auth:
        - manage
      parameters: []
      responses:
        '200':
          description: responds with successful body
          content:
            application/json:
              examples:
                responds with successful body:
                  value:
                    data:
                      engagementId: A5540727
                      bankAccountId: Af7b1993
                      payoutUsage: null
                      isPrimary: true
                      currencyCode: USD
                      countryCode: US
                      details:
                        bankAccountName: David Wallas
                        accountNumber: '123456789'
                        iban: null
                        swiftBicCode: null
                        branchCode: '123456789'
                        bankCode: null
                        recipientCity: New York
                        recipientStreet: Street
                        recipientCountry: US
                        recipientZipPostCode: '10001'
                        recipientStateOrProvince: NY
                        intermediaryAccountNumber: null
                        intermediaryIban: null
                        intermediaryBranchCode: null
                        intermediarySwiftBicCode: null
                        contactNotes: null
                        contactEmail: null
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/bankAccount'
                required:
                - data
        '422':
          description: Unprocessable - rulesetId incorrect
          content:
            application/json:
              examples:
                Unprocessable:
                  value:
                    errors:
                    - message: Invalid country code U!
                    - message: Invalid currency code US!
                Unprocessable - rulesetId incorrect:
                  value:
                    errors:
                    - message: Can't find ruleset with given ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                engagementId:
                  type: string
                  minLength: 1
                  pattern: ^[\w+\-]{8,9}$
                isPrimary:
                  type: boolean
                currencyCode:
                  type: string
                  minLength: 3
                  maxLength: 3
                countryCode:
                  type: string
                  minLength: 2
                  maxLength: 2
                details:
                  type: object
                useForExpenses:
                  type: boolean
                rulesetId:
                  type: string
              required:
              - engagementId
              - isPrimary
              - currencyCode
              - countryCode
              - details
            examples:
              responds with successful body:
                summary: responds with successful body
                value:
                  engagementId: A5540727
                  isPrimary: true
                  countryCode: US
                  currencyCode: USD
                  rulesetId: USD-US
                  details:
                    bankAccountName: David Wallas
                    accountNumber: '123456789'
                    branchCode: '123456789'
                    recipientCity: New York
                    recipientStateOrProvince: NY
                    recipientZipPostCode: '10001'
                    recipientCountry: US
                    recipientStreet: Street
      operationId: postV1BankAccounts
      x-operation-id-source: derived
  /v1/bank_accounts/rulesets:
    get:
      summary: Retrieve bank account rulesets
      tags:
      - Bank Accounts
      description: Returns rulesets.
      security:
      - bearer_auth:
        - read
      parameters:
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: currency_code
        in: query
        required: true
        schema:
          type: string
      - name: country_code
        in: query
        required: true
        schema:
          type: string
      - name: engagement_type
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                    - rulesetId: BRL-BR
                      scope: {}
                      schemas:
                        post:
                          type: object
                          properties:
                            engagementId:
                              type: string
                            isPrimary:
                              type: boolean
                            useForExpenses:
                              type: boolean
                            currencyCode:
                              type: string
                              pattern: ^[A-Z]{3}$
                            countryCode:
                              type: string
                              pattern: ^[a-zA-Z]{2}$
                            details:
                              type: object
                              properties:
                                accountNumber:
                                  title: Account number
                                  type: string
                                  pattern: ^[0-9]{4,12}(-)?[0-9Xx]$
                                branchCode:
                                  title: Branch code
                                  type: string
                                  pattern: ^[0-9]{4}$
                                swiftBicCode:
                                  title: SWIFT/BIC
                                  type: string
                                  pattern: ^([A-z0-9]{8}|[A-z0-9]{11})$
                                bankCode:
                                  title: Bank code
                                  type: string
                                  pattern: ^[0-9]{3}$
                                bankAccountName:
                                  title: Account holder name (exactly as defined on your bank account)
                                  type: string
                                  pattern: ^[A-z0-9 .,()_'-/]{1,255}$
                                recipientStreet:
                                  title: Recipient street
                                  type: string
                                  pattern: ^[A-z0-9 .,()_'-/]{1,200}$
                                recipientCity:
                                  title: Recipient city
                                  type: string
                                  pattern: ^[A-z0-9 .,()_'-/]{1,50}$
                                recipientStateOrProvince:
                                  title: Recipient state or province
                                  type: string
                                  pattern: ^[A-z0-9 .,()_'-/]{1,50}$
                                recipientZipPostCode:
                                  title: Recipient zip post code
                                  type: string
                                  pattern: ^[A-z0-9 .,()_'-/]{1,15}$
                                recipientCountry:
                                  title: Recipient country
                                  type: string
                                  pattern: ^[A-Z]{2}$
                                beneficiaryIdentificationType:
                                  title: Beneficiary identification type
                                  enum:
                                  - CPF
                                  - CNPJ
                                beneficiaryIdentificationValue:
                                  title: Beneficiary identification value
                                  type: string
                                  pattern: ^[0-9.-]{11,20}$
                              required:
                              - accountNumber
                              - branchCode
                              - bankCode
                              - bankAccountName
                              - recipientStreet
                              - recipientCity
                              - recipientCountry
                              - beneficiaryIdentificationType
                              - beneficiaryIdentificationValue
                          required:
                          - engagementId
                          - isPrimary
                          - currencyCode
                          - countryCode
                          - details
                        patch:
                          type: object
                          properties:
                            isPrimary:
                              type: boolean
                            useForExpenses:
                              type: boolean
                          required: []
                    meta:
                      items: 10
                      count: 1
                      page: 1
                      pages: 1
                      firstUrl: /v1/bank_accounts/rulesets?perPage=10&page=1&currencyCode=BRL&countryCode=BR&engagementType=employment
                      lastUrl: /v1/bank_accounts/rulesets?perPage=10&page=1&currencyCode=BRL&countryCode=BR&engagementType=employment
                      pageUrl: /v1/bank_accounts/rulesets?perPage=10&page=1&currencyCode=BRL&countryCode=BR&engagementType=employment
                      nextUrl: /v1/bank_accounts/rulesets?perPage=10&page=&currencyCode=BRL&countryCode=BR&engagementType=employment
                      prevUrl: /v1/bank_accounts/rulesets?perPage=10&page=&currencyCode=BRL&countryCode=BR&engagementType=employment
      operationId: getV1BankAccountsRulesets
      x-operation-id-source: derived
  /v1/bank_accounts/{id}:
    delete:
      summary: Delete bank account
      tags:
      - Bank Accounts
      description: Deletes non primary bank accounts
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: id
        in: path
        description: Bank account ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              examples:
                Unprocessable Entity:
                  value:
                    errors:
                    - message: Managing bank accounts for an FTE from this country is not currently supported.
      operationId: deleteV1BankAccountsById
      x-operation-id-source: derived
    get:
      summary: Retrieve Bank Account details
      tags:
      - Bank Accounts
      description: Returns details about bank account
      security:
      - bearer_auth:
        - read
      parameters:
      - name: id
        in: path
        description: Bank account ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
            application/json:
              examples:
                Successful:
                  value:
                    data:
                      engagementId: A5540727
                      bankAccountId: Af7b1993
                      payoutUsage: null
                      isPrimary: true
                      currencyCode: USD
                      countryCode: US
                      details:
                        bankAccountName: David Wallace
                        accountNumber: '123456789012'
                        iban: null
                        swiftBicCode: null
                        branchCode: '071004200'
                        bankCode: null
                        recipientCity: North Krishna
                        recipientStreet: 91744 Joel Drives
                        recipientCountry: TT
                        recipientZipPostCode: '99841'
                        recipientStateOrProvince: SFO
                        intermediaryAccountNumber: null
                        intermediaryIban: null
                        intermediaryBranchCode: null
                        intermediarySwiftBicCode: null
                        contactNotes: null
                        contactEmail: null
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/bankAccount'
                required:
                - data
      operationId: getV1BankAccountsById
      x-operation-id-source: derived
    patch:
      summary: Update bank account
      tags:
      - Bank Accounts
      description: Updates a bank account
      security:
      - bearer_auth:
        - manage
      parameters:
      - name: id
        in: path
        description: Bank account ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully updated bank account
          content:
            application/json:
              examples:
                Successfully updated bank account:
                  value:
                    data:
                      engagementId: A5540727
                      bankAccountId: Af7b1993
                      payoutUsage: null
                      isPrimary: false
                      currencyCode: USD
                      countryCode: US
                      details:
                        bankAccountName: David Wallace
                        accountNumber: '271111111111'
                        iban: null
                        swiftBicCode: null
                        branchCode: '123344558'
                        bankCode: null
                        recipientCity: Walterside
                        recipientStreet: 761 Gabriella Row
                        recipientCountry: US
                        recipientZipPostCode: 59047-9913
                        recipientStateOrProvince: NE
                        intermediaryAccountNumber: null
                        intermediaryIban: null
                        intermediaryBranchCode: null
                        intermediarySwiftBicCode: null
                        contactNotes: null
                        contactEmail: null
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/bankAccount'
                required:
                - data
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              examples:
                Unprocessable Entity:
                  value:
                    errors:
                    - message: Managing bank accounts for an FTE from this country is not currently supported.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isPrimary:
                  type: boolean
                useForExpenses:
                  type: boolean
                alternativeBankAccountId:
                  type: string
                  minLength: 1
                  pattern: ^[\w+\-]{8,9}$
            examples:
              Successfully updated bank account:
                summary: Successfully updated bank account
                value:
                  isPrimary: false
                  alternativeBankAccountId: Bcfb72c6
      operationId: patchV1BankAccountsById
      x-operation-id-source: derived
